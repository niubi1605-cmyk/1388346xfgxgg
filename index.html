<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体加密解密 - 永久持久版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        /* 公告栏 */
        .notice {
            background: #e6f7ff;
            border: 1px solid #91caff;
            color: #0050b3;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .notice h4 {
            font-size: 14px;
            margin-bottom: 6px;
        }
        /* 全局锁定遮罩 */
        .global-lock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lock-alert {
            background: #fff;
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
        }
        .lock-alert h2 {
            color: #f5222d;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .lock-alert p {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .lock-alert input {
            width: 80%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        .lock-alert button {
            padding: 8px 24px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        /* 警告提示 */
        .warn-tip {
            background: #fff7e6;
            border: 1px solid #ffcc00;
            color: #d48806;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        /* 管理员区域 */
        .admin-pwd-box {
            background: #fef0f0;
            border: 1px solid #ff9494;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .admin-pwd-box h4 {
            font-size: 14px;
            color: #cf1322;
            margin-bottom: 8px;
        }
        /* 套餐区域 */
        .package-box {
            background: #f0f7ff;
            border: 1px solid #91caff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .package-title {
            font-size: 14px;
            color: #1677ff;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .package-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .pkg-btn {
            flex: 1;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        .pkg-btn.active {
            background: #1677ff;
            color: #fff;
            border-color: #1677ff;
        }
        .pkg-desc {
            font-size: 13px;
            color: #333;
            line-height: 1.4;
        }
        /* 计数底部 */
        .count-footer {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
        h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #222;
            font-size: 17px;
        }
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            padding: 7px;
            border-radius: 8px;
            border: 1px solid #eee;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
        }
        .mode-btn.active {
            background: #1677ff;
            color: #fff;
            border-color: #1677ff;
        }
        .lock-input {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 11px;
            margin: 8px 0;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
        }
        .lock-tip {
            color: #666;
            font-size: 14px;
            margin: 5px 0 10px;
        }
        .lock-btn-wrap {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .lock-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-blue {
            background: #1677ff;
            color: #fff;
        }
        .btn-gray {
            background: #e5e7eb;
            color: #333;
        }
        .btn-green {
            background: #52c41a;
            color: #fff;
        }
        /* 滑动预览 */
        .slide-outer {
            position: relative;
            margin: 10px 0;
        }
        .slide-wrap {
            width: 100%;
            height: 260px;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            gap: 0;
            padding: 10px 0;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            background: #f9fafb;
            border-radius: 10px;
            overscroll-behavior-x: contain;
        }
        .slide-item {
            flex: 0 0 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-item img, .slide-item video {
            max-width: 90%;
            max-height: 240px;
            border-radius: 8px;
        }
        .slide-wrap::-webkit-scrollbar {
            display: none;
        }
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(22,119,255,0.8);
            color: #fff;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-btn:active {
            background: #1677ff;
        }
        .btn-prev {left: 4px;}
        .btn-next {right: 4px;}
        .hide {display: none;}
    </style>
</head>
<body>
    <div class="container">
        <div class="notice">
            <h4>📢 版本更新：永久持久存储版</h4>
            1. 改用 IndexedDB 持久化存储，关闭/杀后台/重启仍可用<br>
            2. 彻底修复所有按钮点击失效问题<br>
            3. 保留北京时间防篡改、设备检测、管理员权限<br>
            4. 媒体文件永久留存（不清浏览器数据不丢失）
        </div>

        <div class="warn-tip">
            ⚠️ 温馨提醒：单文件建议控制在 50MB 以内，过大文件转换较慢
        </div>

        <div class="admin-pwd-box">
            <h4>🔐 管理员专属解锁（免费用户无需填写）</h4>
            <input type="text" id="adminPwdInput" class="lock-input" placeholder="请输入管理员密码">
            <div class="lock-btn-wrap">
                <button class="lock-btn btn-blue" id="unlockAdmin">确认解锁</button>
                <button class="lock-btn btn-gray" id="logoutAdmin">退出管理员</button>
            </div>
        </div>

        <div class="package-box">
            <div class="package-title">当前套餐</div>
            <div class="package-switch">
                <button class="pkg-btn active" id="freePkg">免费用户</button>
                <button class="pkg-btn" id="adminPkgBtn" disabled>管理员专属</button>
            </div>
            <div class="pkg-desc" id="pkgDesc">
                免费套餐：每日限3次上传 | 管理员：无限制
            </div>
        </div>

        <h3 id="uiTitle">🔒 批量加密 照片/视频</h3>
        <div class="mode-switch">
            <button class="mode-btn active" id="tabEnc">加密模式</button>
            <button class="mode-btn" id="tabDec">解密模式</button>
        </div>

        <div id="encBox">
            <div class="lock-tip" id="fileTip">未选择任何文件</div>
            <input type="file" id="fileIn" accept="image/*,video/*" multiple class="lock-input">
            <input type="text" id="pwdEnc" class="lock-input" placeholder="输入自定义口令">
            <div class="lock-btn-wrap">
                <button class="lock-btn btn-blue" id="doEnc">批量加密</button>
                <button class="lock-btn btn-gray" id="resetEnc">重置</button>
            </div>
        </div>

        <div id="decBox" class="hide">
            <input type="text" id="pwdDec" class="lock-input" placeholder="输入解密口令">
            <div class="slide-outer">
                <button class="slide-btn btn-prev" id="prevBtn">‹</button>
                <div class="slide-wrap" id="slideBox">
                    <div class="slide-item">请先解密加载媒体</div>
                </div>
                <button class="slide-btn btn-next" id="nextBtn">›</button>
            </div>
            <div class="lock-btn-wrap">
                <button class="lock-btn btn-green" id="doDec">解密加载</button>
                <button class="lock-btn btn-blue" id="saveAll">全部保存</button>
                <button class="lock-btn btn-gray" id="resetDec">清空</button>
            </div>
        </div>

        <div class="count-footer" id="countFooter">
            今日已上传：0 次 | 剩余次数：3 次
        </div>
    </div>

    <script>
        // 基础配置
        const DAILY_FREE_LIMIT = 3;
        const ADMIN_PASSWORD = "管理员牛逼";
        const UNLOCK_WORD = "我错了";
        const DAY_SEC = 86400;
        let userType = "free";
        let uploadCount = 0;
        let nowFiles = [];
        let decryptList = [];
        let currentIndex = 0;

        // ========== IndexedDB 数据库初始化（持久化存储核心） ==========
        const DB_NAME = "MediaEncDB";
        const DB_STORE = "MediaData";
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = e => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE, { keyPath: "key" });
                    }
                };
                req.onsuccess = e => {
                    db = e.target.result;
                    resolve(db);
                };
                req.onerror = e => reject(e);
            });
        }

        async function saveToDB(key, data) {
            await initDB();
            const tx = db.transaction(DB_STORE, "readwrite");
            const store = tx.objectStore(DB_STORE);
            await store.put({ key, data });
        }

        async function getFromDB(key) {
            await initDB();
            const tx = db.transaction(DB_STORE, "readonly");
            const store = tx.objectStore(DB_STORE);
            const res = await store.get(key);
            return res ? res.data : null;
        }

        // ========== 北京时间 防篡改计时 ==========
        function getBeijingDayStamp() {
            const nowTs = Date.now();
            const bjOffset = 8 * 3600 * 1000;
            const bjTime = nowTs + bjOffset;
            return Math.floor(bjTime / DAY_SEC / 1000) * DAY_SEC * 1000;
        }

        // ========== 设备指纹检测 ==========
        function getDeviceFingerprint() {
            const ua = navigator.userAgent;
            const screenInfo = `${screen.width}-${screen.height}-${screen.colorDepth}`;
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const lang = navigator.language;
            return btoa(`${ua}|${screenInfo}|${tz}|${lang}`);
        }

        (function deviceCheck() {
            const currentFinger = getDeviceFingerprint();
            const firstFinger = localStorage.getItem('deviceFirstFinger');
            if (!firstFinger) {
                localStorage.setItem('deviceFirstFinger', currentFinger);
                return;
            }
            if (firstFinger !== currentFinger) {
                const lockMask = document.createElement('div');
                lockMask.className = 'global-lock';
                lockMask.innerHTML = `
                    <div class="lock-alert">
                        <h2>⚠️ 违规检测</h2>
                        <p>检测到更换浏览器/异地访问</p>
                        <p>请输入指定文字解除限制：</p>
                        <input type="text" id="unlockInput" placeholder="请输入文字">
                        <br>
                        <button id="confirmUnlock">确认进入</button>
                    </div>
                `;
                document.body.appendChild(lockMask);
                document.body.style.overflow = 'hidden';
                document.getElementById('confirmUnlock').onclick = function () {
                    const val = document.getElementById('unlockInput').value.trim();
                    if (val === UNLOCK_WORD) {
                        localStorage.setItem('uploadCount', DAILY_FREE_LIMIT);
                        document.body.removeChild(lockMask);
                        document.body.style.overflow = 'auto';
                        initUploadCount();
                        refreshCountView();
                    } else {
                        alert('输入错误，请重新填写！');
                    }
                };
                throw new Error("设备异常");
            }
        })();

        // ========== 每日次数初始化 ==========
        function initUploadCount() {
            const todayZero = getBeijingDayStamp();
            const lastDayStamp = parseInt(localStorage.getItem('lastDayStamp')) || 0;
            let count = parseInt(localStorage.getItem('uploadCount')) || 0;
            if (todayZero !== lastDayStamp) {
                count = 0;
                localStorage.setItem('lastDayStamp', todayZero);
                localStorage.setItem('uploadCount', 0);
            }
            uploadCount = count;
        }
        initUploadCount();

        // ========== 口令编解码 ==========
        function encodePwd(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // ========== 文件转 Base64（永久可用） ==========
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = err => reject(err);
                reader.readAsDataURL(file);
            });
        }

        // ========== 滑动翻页 ==========
        function slidePrev(box) {
            if (currentIndex <= 0) return;
            currentIndex--;
            box.scrollLeft = box.offsetWidth * currentIndex;
        }
        function slideNext(box) {
            if (currentIndex >= decryptList.length - 1) return;
            currentIndex++;
            box.scrollLeft = box.offsetWidth * currentIndex;
        }

        // ========== DOM 节点 ==========
        const adminPwdInput = document.getElementById('adminPwdInput');
        const unlockAdmin = document.getElementById('unlockAdmin');
        const logoutAdmin = document.getElementById('logoutAdmin');
        const freePkg = document.getElementById('freePkg');
        const adminPkgBtn = document.getElementById('adminPkgBtn');
        const pkgDesc = document.getElementById('pkgDesc');
        const countFooter = document.getElementById('countFooter');
        const tabEnc = document.getElementById('tabEnc');
        const tabDec = document.getElementById('tabDec');
        const encBox = document.getElementById('encBox');
        const decBox = document.getElementById('decBox');
        const uiTitle = document.getElementById('uiTitle');
        const fileIn = document.getElementById('fileIn');
        const fileTip = document.getElementById('fileTip');
        const pwdEnc = document.getElementById('pwdEnc');
        const doEnc = document.getElementById('doEnc');
        const resetEnc = document.getElementById('resetEnc');
        const pwdDec = document.getElementById('pwdDec');
        const doDec = document.getElementById('doDec');
        const saveAll = document.getElementById('saveAll');
        const resetDec = document.getElementById('resetDec');
        const slideBox = document.getElementById('slideBox');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ========== 页面刷新 ==========
        function refreshCountView() {
            const remain = userType === "free" ? DAILY_FREE_LIMIT - uploadCount : "无限制";
            countFooter.innerText = `今日已上传：${uploadCount} 次 | 剩余次数：${remain}`;
        }
        function refreshPkgDesc() {
            if (userType === "free") {
                freePkg.classList.add('active');
                adminPkgBtn.classList.remove('active');
                adminPkgBtn.disabled = true;
            } else {
                adminPkgBtn.classList.add('active');
                freePkg.classList.remove('active');
                adminPkgBtn.disabled = false;
            }
            refreshCountView();
        }
        refreshPkgDesc();

        // ========== 按钮事件 ==========
        unlockAdmin.onclick = function () {
            const pwd = adminPwdInput.value.trim();
            if (pwd === ADMIN_PASSWORD) {
                userType = "admin";
                adminPwdInput.value = "";
                alert("✅ 管理员解锁成功，无限上传");
                refreshPkgDesc();
            } else {
                alert("❌ 密码错误");
            }
        };
        logoutAdmin.onclick = function () {
            userType = "free";
            adminPwdInput.value = "";
            alert("✅ 已切回免费用户");
            refreshPkgDesc();
        };
        freePkg.onclick = function () {
            userType = "free";
            refreshPkgDesc();
        };
        adminPkgBtn.onclick = function () {
            if (!adminPkgBtn.disabled) {
                userType = "admin";
                refreshPkgDesc();
            }
        };
        tabEnc.onclick = function () {
            tabEnc.classList.add('active');
            tabDec.classList.remove('active');
            encBox.classList.remove('hide');
            decBox.classList.add('hide');
            uiTitle.innerText = '🔒 批量加密 照片/视频';
        };
        tabDec.onclick = function () {
            tabDec.classList.add('active');
            tabEnc.classList.remove('active');
            decBox.classList.remove('hide');
            encBox.classList.add('hide');
            uiTitle.innerText = '🔓 解密｜口令解锁+翻页浏览';
        };
        fileIn.onchange = function (e) {
            nowFiles = Array.from(e.target.files);
            fileTip.innerText = `已选：${nowFiles.length} 个媒体文件`;
        };

        // 批量加密（转Base64存入IndexedDB，永久保存）
        doEnc.onclick = async function () {
            const pwd = pwdEnc.value.trim();
            if (nowFiles.length === 0) {
                alert('请先选择文件！');
                return;
            }
            if (!pwd) {
                alert('请输入加密口令！');
                return;
            }
            if (userType === "free" && uploadCount >= DAILY_FREE_LIMIT) {
                alert("❌ 今日免费次数已用完");
                return;
            }
            const key = encodePwd(pwd);
            let fileList = [];
            try {
                for (const file of nowFiles) {
                    const base64 = await fileToBase64(file);
                    fileList.push({
                        name: file.name,
                        type: file.type,
                        data: base64
                    });
                }
                await saveToDB(key, fileList);
                if (userType === "free") {
                    uploadCount++;
                    localStorage.setItem('uploadCount', uploadCount);
                    refreshCountView();
                }
                alert(`✅ 加密并永久保存成功！\n口令：${pwd}`);
                resetEnc.onclick();
            } catch (err) {
                alert("文件处理失败，文件过大或格式不支持");
            }
        };

        resetEnc.onclick = function () {
            nowFiles = [];
            fileIn.value = "";
            pwdEnc.value = "";
            fileTip.innerText = "未选择任何文件";
        };

        // 解密加载
        doDec.onclick = async function () {
            const pwd = pwdDec.value.trim();
            if (!pwd) {
                alert('请输入解密口令！');
                return;
            }
            const key = encodePwd(pwd);
            const res = await getFromDB(key);
            if (!res) {
                alert("❌ 口令错误或无对应数据");
                slideBox.innerHTML = '<div class="slide-item">解密失败</div>';
                decryptList = [];
                return;
            }
            decryptList = res;
            currentIndex = 0;
            alert(`✅ 解密成功，共 ${decryptList.length} 个文件`);
            slideBox.innerHTML = "";
            decryptList.forEach(item => {
                const div = document.createElement('div');
                div.className = "slide-item";
                if (item.type.startsWith('image')) {
                    div.innerHTML = `<img src="${item.data}" alt="">`;
                } else {
                    div.innerHTML = `<video src="${item.data}" controls></video>`;
                }
                slideBox.appendChild(div);
            });
            slideBox.scrollLeft = 0;
        };

        // 批量保存
        saveAll.onclick = function () {
            if (decryptList.length === 0) {
                alert('请先解密！');
                return;
            }
            decryptList.forEach(item => {
                const a = document.createElement('a');
                a.href = item.data;
                a.download = item.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
            alert("✅ 全部保存完成");
        };

        resetDec.onclick = function () {
            decryptList = [];
            currentIndex = 0;
            pwdDec.value = "";
            slideBox.innerHTML = '<div class="slide-item">请先解密加载媒体</div>';
        };
        prevBtn.onclick = () => slidePrev(slideBox);
        nextBtn.onclick = () => slideNext(slideBox);
    </script>
</body>
</html>
