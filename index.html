<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>视频仓库</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e8eaed}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#171a21;position:sticky;top:0;z-index:20;border-bottom:1px solid #2a2f3a}
  header h1{font-size:18px;margin:0}
  #menuBtn{background:none;border:none;color:#e8eaed;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
  #menuPanel{position:fixed;top:56px;right:12px;width:260px;max-height:70vh;overflow:auto;background:#1c2029;border:1px solid #333a46;border-radius:10px;padding:12px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #menuPanel.hidden{display:none}
  #retainBtn{width:100%;padding:10px;border:none;border-radius:8px;background:#2d3442;color:#fff;font-size:15px;cursor:pointer;margin-bottom:10px}
  #retainBtn:hover{background:#3a4354}
  #menuPanel h3{font-size:14px;margin:8px 0;color:#9aa4b2}
  #historyList{list-style:none;margin:0;padding:0}
  #historyList li{padding:8px;border-radius:6px;background:#252b36;margin-bottom:6px;font-size:13px;cursor:pointer;word-break:break-all}
  #historyList li:hover{background:#303847}
  #historyList li.empty{color:#6b7280;cursor:default;background:none}
  #playerWrap{position:relative;background:#000;margin:0 auto;max-width:900px}
  #video{width:100%;max-height:60vh;background:#000;display:block}
  #playerInfo{padding:8px 12px;font-size:13px;color:#9aa4b2;background:#171a21}
  #landscapeBtn{position:absolute;right:10px;top:10px;padding:6px 10px;border:none;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:12px;max-width:1000px;margin:0 auto}
  .card{background:#1c2029;border:1px solid #2a2f3a;border-radius:8px;padding:10px 8px;cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s}
  .card:hover{background:#252b36}
  .card .ep{font-size:12px;color:#6b7280}
  .card .title{font-size:13px;text-align:center;line-height:1.3;word-break:break-all}
  .card.locked{opacity:.75}
  .card.locked .title{color:#f59e0b}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  video:fullscreen{max-height:100vh;height:100vh;object-fit:contain}
  @media (max-width:600px){#video{max-height:40vh} #list{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));padding:8px}}

  #fake404,#gate{display:none}
  #fake404{position:fixed;inset:0;background:#0f1115;color:#6b7280;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;font-size:15px;gap:8px}
  #fake404 .code{font-size:48px;font-weight:700;color:#374151}
  #gate{position:fixed;inset:0;background:#0f1115;z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:24px}
  #gate > div{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:280px}
  #gate h2{margin:0;font-size:18px;color:#e8eaed}
  #gate p{margin:0;font-size:13px;color:#ef4444;min-height:18px;text-align:center}
  #gate input{width:100%;padding:10px;border-radius:8px;border:1px solid #333a46;background:#1c2029;color:#e8eaed;font-size:15px;outline:none;text-align:center}
  #gate input:focus{border-color:#4b5563}
  #gate button{padding:10px 24px;border:none;border-radius:8px;background:#2d3442;color:#fff;font-size:15px;cursor:pointer;width:100%}
  #gate button:hover{background:#3a4354}
  #gate button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<div id="fake404">
  <div class="code">404</div>
  <div>Not Found</div>
</div>

<div id="gate">
  <div id="humanStep">
    <h2>人机验证</h2>
    <p id="mathQuestion" style="color:#9aa4b2"></p>
    <input type="number" id="mathAnswer" inputmode="numeric" placeholder="输入答案" autocomplete="off">
    <button id="mathBtn">验证</button>
    <p id="mathMsg"></p>
  </div>
  <div id="pwdStep" style="display:none">
    <h2>访问密码</h2>
    <input type="password" id="gatePwd" placeholder="请输入访问密码" autocomplete="new-password">
    <button id="gateBtn">进入</button>
    <p id="gateMsg"></p>
  </div>
</div>

<div id="mainApp" style="display:none">

<header>
  <h1>视频仓库</h1>
  <button id="menuBtn" aria-label="菜单">⋮</button>
</header>

<div id="menuPanel" class="hidden">
  <button id="retainBtn">想删除</button>
  <h3>浏览记录</h3>
  <ul id="historyList"></ul>
</div>

<div id="playerWrap">
  <video id="video" controls playsinline></video>
  <button id="landscapeBtn">横屏播放</button>
  <div id="playerInfo">请选择集数播放</div>
</div>

<div id="list"></div>
<div id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
/* ============================================================
   访问控制配置
   ============================================================ */
const URL_KEY = 'vk_9f4c2a7e1d8b3f6a';

// 建议尽快替换成你自己的 SHA-256 哈希（生成方法见说明）
const ACCESS_HASH = 'REPLACE_WITH_YOUR_SHA256_HASH';

// 兜底明文密码：在 ACCESS_HASH 未替换前使用，方便你立刻测试
const ACCESS_FALLBACK = 'Vq7#mK2$pL9@xR4!tN8';

const MAX_FAIL = 5;
const LOCK_MS = 60 * 1000;
const FAIL_KEY = 'gate_fail_count';
const LOCK_KEY = 'gate_lock_until';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function showApp() {
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('gate').style.display = 'none';
  document.getElementById('fake404').style.display = 'none';
}

let mathAnswer = 0;
function newMathQuestion() {
  const a = Math.floor(Math.random() * 20) + 1;
  const b = Math.floor(Math.random() * 20) + 1;
  if (Math.random() > 0.5) {
    mathAnswer = a + b;
    document.getElementById('mathQuestion').textContent = `请计算：${a} + ${b} = ?`;
  } else {
    const big = Math.max(a, b), small = Math.min(a, b);
    mathAnswer = big - small;
    document.getElementById('mathQuestion').textContent = `请计算：${big} - ${small} = ?`;
  }
  document.getElementById('mathAnswer').value = '';
  document.getElementById('mathMsg').textContent = '';
}

function checkMath() {
  const val = parseInt(document.getElementById('mathAnswer').value, 10);
  if (val === mathAnswer) {
    document.getElementById('humanStep').style.display = 'none';
    document.getElementById('pwdStep').style.display = 'flex';
    document.getElementById('gatePwd').focus();
  } else {
    document.getElementById('mathMsg').textContent = '验证失败，请重新计算';
    newMathQuestion();
  }
}

let lockTimer = null;
function startLockCountdown(until) {
  const msg = document.getElementById('gateMsg');
  const btn = document.getElementById('gateBtn');
  const input = document.getElementById('gatePwd');
  input.disabled = true;
  btn.disabled = true;
  function tick() {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(lockTimer);
      lockTimer = null;
      input.disabled = false;
      btn.disabled = false;
      msg.textContent = '';
      localStorage.removeItem(LOCK_KEY);
      return;
    }
    msg.textContent = `尝试次数过多，请 ${left} 秒后再试`;
  }
  tick();
  if (lockTimer) clearInterval(lockTimer);
  lockTimer = setInterval(tick, 1000);
}

async function checkGate() {
  const input = document.getElementById('gatePwd');
  const msg = document.getElementById('gateMsg');
  const pwd = input.value;
  if (!pwd) { msg.textContent = '请输入密码'; return; }

  let ok = false;
  if (ACCESS_HASH.includes('REPLACE_WITH')) {
    ok = (pwd === ACCESS_FALLBACK);
  } else {
    ok = ((await sha256(pwd)) === ACCESS_HASH);
  }

  if (ok) {
    localStorage.removeItem(FAIL_KEY);
    localStorage.removeItem(LOCK_KEY);
    sessionStorage.setItem('gate_ok', '1');
    showApp();
  } else {
    let fails = parseInt(localStorage.getItem(FAIL_KEY) || '0') + 1;
    if (fails >= MAX_FAIL) {
      localStorage.setItem(FAIL_KEY, '0');
      const until = Date.now() + LOCK_MS;
      localStorage.setItem(LOCK_KEY, until);
      startLockCountdown(until);
    } else {
      localStorage.setItem(FAIL_KEY, fails);
      msg.textContent = `密码错误，还可尝试 ${MAX_FAIL - fails} 次`;
      input.value = '';
      input.focus();
    }
  }
}

(function initGate() {
  const params = new URLSearchParams(location.search);
  if (params.get('k') !== URL_KEY) {
    document.getElementById('fake404').style.display = 'flex';
    return;
  }
  if (sessionStorage.getItem('gate_ok') === '1') {
    showApp();
    return;
  }
  document.getElementById('gate').style.display = 'flex';

  const lockUntil = parseInt(localStorage.getItem(LOCK_KEY) || '0');
  if (lockUntil > Date.now()) {
    document.getElementById('humanStep').style.display = 'none';
    document.getElementById('pwdStep').style.display = 'flex';
    startLockCountdown(lockUntil);
  } else {
    localStorage.removeItem(LOCK_KEY);
    newMathQuestion();
  }

  document.getElementById('mathBtn').onclick = checkMath;
  document.getElementById('mathAnswer').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkMath();
  });
  document.getElementById('gateBtn').onclick = checkGate;
  document.getElementById('gatePwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkGate();
  });
})();

/* ============================================================
   链接智能解密：Base64 / URL编码 / AES 自动尝试
   ============================================================ */
const AES_KEY_HEX = '';  // 有 AES 密钥才填
const AES_IV_HEX  = '';

function looksLikeUrl(s) {
  return typeof s === 'string' && /^https?:\/\//i.test(s.trim());
}
function normalizeB64(s) {
  let t = String(s).replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
  while (t.length % 4) t += '=';
  return t;
}
function tryBase64(s) {
  try {
    const d = atob(normalizeB64(s));
    if (/^[\x20-\x7E\r\n]+$/.test(d)) return d.trim();
  } catch (e) {}
  return null;
}
function tryUrlDecode(s) {
  try {
    const d = decodeURIComponent(s);
    if (d !== s) return d.trim();
  } catch (e) {}
  return null;
}
function hexToBytes(hex) {
  return new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
}
async function tryAes(s) {
  if (!AES_KEY_HEX || !AES_IV_HEX) return null;
  try {
    const raw = Uint8Array.from(atob(normalizeB64(s)), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey(
      'raw', hexToBytes(AES_KEY_HEX), { name: 'AES-CBC' }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-CBC', iv: hexToBytes(AES_IV_HEX) }, cryptoKey, raw
    );
    return new TextDecoder().decode(plain).trim();
  } catch (e) {
    return null;
  }
}
async function decodeLink(link) {
  if (!link) return link;
  let cur = String(link).trim();
  if (looksLikeUrl(cur)) return cur;

  for (let round = 0; round < 3; round++) {
    let next = tryBase64(cur);
    if (next && looksLikeUrl(next)) return next;

    next = tryUrlDecode(cur);
    if (next && looksLikeUrl(next)) return next;

    next = await tryAes(cur);
    if (next && looksLikeUrl(next)) return next;

    if (next && next !== cur) { cur = next; continue; }
    break;
  }

  const candidates = [tryBase64(cur), tryUrlDecode(cur), await tryAes(cur)].filter(Boolean);
  for (const c of candidates) {
    if (/\.m3u8(\?|$)/i.test(c) || c.includes('://')) return c.trim();
  }
  return link;
}

/* ============================================================
   视频数据
   ============================================================ */
const STREAMS = [
  'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
  'https://test-streams.mux.dev/pts_shift/master.m3u8',
  'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8',
  'https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_16x9/bipbop_16x9_variant.m3u8',
  'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8',
  'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8',
  'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8',
  'https://moctobpltc-i.akamaihd.net/hls/live/571329/eight/playlist.m3u8'
];

/* 会员链接：第 31–60 集填这里 */
const VIP_LINKS = {
  // 31: 'https://hls.weagdnz.cn/videos5/5a80a2e2403a702981acb17828c81640/5a80a2e2403a702981acb17828c81640.m3u8?auth_key=1792221588-6ad32194be736-0-8b497c5829ebe31a519acc40ab4e8503&v=3&time=0',
  // 32: 'https://你的域名/vip/32.m3u8',
  // ...
  // 60: 'https://你的域名/vip/60.m3u8'
};

const TOTAL = 60;
const VIP_START = 31;
const PASSWORD = atob('OTAwMDMwMzM=');
let unlocked = sessionStorage.getItem('vip_unlocked') === '1';
let hls = null;
let currentIndex = null;
let longPressTimer = null;
let longPressTriggered = false;

const videos = [];
for (let i = 1; i <= TOTAL; i++) {
  const isVip = i >= VIP_START;
  const realLink = isVip
    ? (VIP_LINKS[i] || STREAMS[(i - 1) % STREAMS.length])
    : STREAMS[(i - 1) % STREAMS.length];
  videos.push({
    id: i,
    isVip,
    title: isVip ? 'VIP第' + i + '集' : '第' + i + '集',
    link: isVip ? btoa(realLink) : realLink
  });
}

function renderList() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'card' + (v.isVip && !unlocked ? ' locked' : '');
    card.dataset.id = v.id;
    const title = (v.isVip && !unlocked) ? '非会员内容' : v.title;
    card.innerHTML = `<span class="ep">${v.id}</span><span class="title">${title}</span>`;

    card.addEventListener('click', () => {
      if (longPressTriggered) { longPressTriggered = false; return; }
      playVideo(v.id);
    });

    const startLongPress = () => {
      if (longPressTimer) clearTimeout(longPressTimer);
      longPressTriggered = false;
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        const newLink = prompt('粘贴 M3U8 链接（长按功能）', '');
        if (newLink && newLink.trim()) {
          const target = videos.find(x => x.id === v.id);
          if (target) {
            if (target.isVip && !unlocked) {
              showToast('非会员内容，请先解锁');
              return;
            }
            target.link = target.isVip ? btoa(newLink.trim()) : newLink.trim();
            showToast('链接已更新');
            if (currentIndex === v.id) playVideo(v.id);
          }
        }
      }, 800);
    };
    const cancelLongPress = () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    };
    card.addEventListener('touchstart', startLongPress, { passive: true });
    card.addEventListener('touchend', cancelLongPress);
    card.addEventListener('touchmove', cancelLongPress);
    card.addEventListener('mousedown', startLongPress);
    card.addEventListener('mouseup', cancelLongPress);
    card.addEventListener('mouseleave', cancelLongPress);

    listEl.appendChild(card);
  });
}

async function playVideo(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  if (v.isVip && !unlocked) {
    showToast('非会员内容：第' + id + '集，链接放在这里');
    return;
  }

  let link = v.link;
  if (v.isVip) {
    try { link = atob(v.link); } catch (e) { showToast('链接解码失败'); return; }
  }

  link = await decodeLink(link);

  currentIndex = id;
  const video = document.getElementById('video');
  if (hls) { hls.destroy(); hls = null; }

  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(link);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = link;
    video.play().catch(() => {});
  } else {
    showToast('当前浏览器不支持 HLS 播放');
    return;
  }

  document.getElementById('playerInfo').textContent =
    (v.isVip && unlocked ? v.title : '第' + id + '集') + ' - ' +
    (v.isVip ? '会员内容' : '普通内容');
  addHistory(v);
}

function addHistory(v) {
  let hist = JSON.parse(localStorage.getItem('video_history') || '[]');
  hist = hist.filter(h => h.id !== v.id);
  hist.unshift({
    id: v.id,
    title: (v.isVip && unlocked ? v.title : (v.isVip ? '非会员内容' : v.title)),
    time: Date.now()
  });
  hist = hist.slice(0, 10);
  localStorage.setItem('video_history', JSON.stringify(hist));
  renderHistory();
}

function renderHistory() {
  const ul = document.getElementById('historyList');
  const hist = JSON.parse(localStorage.getItem('video_history') || '[]');
  ul.innerHTML = '';
  if (!hist.length) { ul.innerHTML = '<li class="empty">暂无记录</li>'; return; }
  hist.forEach(h => {
    const v = videos.find(x => x.id === h.id);
    const title = (v && v.isVip && unlocked) ? v.title : h.title;
    const li = document.createElement('li');
    li.textContent = title + '（第' + h.id + '集）';
    li.onclick = () => { playVideo(h.id); closeMenu(); };
    ul.appendChild(li);
  });
}

const menuPanel = document.getElementById('menuPanel');
function toggleMenu() { menuPanel.classList.toggle('hidden'); renderHistory(); }
function closeMenu() { menuPanel.classList.add('hidden'); }
document.getElementById('menuBtn').onclick = (e) => { e.stopPropagation(); toggleMenu(); };
document.addEventListener('click', (e) => {
  if (!menuPanel.contains(e.target) && e.target.id !== 'menuBtn') closeMenu();
});

document.getElementById('retainBtn').onclick = () => {
  const pwd = prompt('请输入密码：');
  if (pwd === null) return;
  if (pwd === PASSWORD) {
    unlocked = true;
    sessionStorage.setItem('vip_unlocked', '1');
    showToast('会员内容已解锁');
    renderList();
    renderHistory();
  } else {
    showToast('非会员内容');
  }
};

document.getElementById('landscapeBtn').onclick = async () => {
  const video = document.getElementById('video');
  try {
    if (video.requestFullscreen) await video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (e) {
    showToast('横屏切换失败，请手动旋转屏幕');
  }
};

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

renderList();
renderHistory();
</script>
</body>
</html>
