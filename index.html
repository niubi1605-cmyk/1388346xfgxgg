<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线无水印短视频下载</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        dark: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        .menu-mask {
            background-color: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="container mx-auto px-4 py-8 max-w-3xl">
    <!-- 顶部栏：左上角三点菜单 -->
    <header class="flex items-center justify-between mb-8">
        <div class="relative">
            <button id="menuBtn" class="p-2 rounded-lg hover:bg-slate-200 transition">
                <i class="fa fa-ellipsis-v text-xl"></i>
            </button>
            <!-- 下拉菜单 -->
            <div id="menuPanel" class="hidden absolute left-0 top-full mt-1 bg-white shadow-lg rounded-lg w-44 z-50 overflow-hidden">
                <button id="changeApiBtn" class="w-full text-left px-4 py-3 hover:bg-slate-100">更换接口</button>
                <button id="aboutBtn" class="w-full text-left px-4 py-3 hover:bg-slate-100">网站介绍</button>
            </div>
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-dark">在线无水印短视频下载</h1>
        <div></div>
    </header>

    <!-- 主输入区域 -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <div class="mb-4">
            <label class="block text-slate-700 mb-2">短视频分享链接</label>
            <input id="videoUrlInput" type="text" placeholder="粘贴抖音/快手/小红书等短视频分享链接"
                   class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div class="flex items-center justify-between mb-4">
            <span class="text-sm text-slate-500">当前接口：<span id="currentApiName">短视频解析聚合</span></span>
            <button id="parseBtn" class="bg-primary text-white px-5 py-2.5 rounded-lg hover:bg-blue-600 transition">
                <i class="fa fa-search mr-1"></i>开始解析
            </button>
        </div>
        <div id="loadingTip" class="hidden text-center text-slate-500 py-3">
            <i class="fa fa-spinner fa-spin mr-2"></i>解析中，请稍候...
        </div>
    </div>

    <!-- 解析结果区域 -->
    <div id="resultBox" class="hidden bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">解析结果</h2>
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <img id="coverImg" class="w-full rounded-lg object-cover" alt="封面">
            </div>
            <div>
                <h3 id="videoTitle" class="font-medium text-lg mb-2"></h3>
                <p id="videoAuthor" class="text-slate-500 text-sm mb-4"></p>
                <a id="downloadBtn" target="_blank" download
                   class="inline-block bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                    <i class="fa fa-download mr-1"></i>下载无水印视频
                </a>
            </div>
        </div>
    </div>
</div>

<!-- 弹窗通用遮罩 -->
<div id="modalMask" class="menu-mask fixed inset-0 z-40 hidden flex items-center justify-center p-4">
    <!-- 更换接口弹窗 -->
    <div id="apiModal" class="hidden bg-white rounded-xl max-w-md w-full p-6">
        <h2 class="text-lg font-bold mb-4">更换接口</h2>
        <div id="apiListBox" class="space-y-2 mb-4">
            <!-- 接口列表JS渲染 -->
        </div>
        <div class="flex justify-end gap-2">
            <button id="closeApiModal" class="px-4 py-2 border rounded-lg hover:bg-slate-100">关闭</button>
        </div>
    </div>

    <!-- 网站介绍弹窗 -->
    <div id="aboutModal" class="hidden bg-white rounded-xl max-w-md w-full p-6">
        <h2 class="text-lg font-bold mb-4">网站介绍</h2>
        <div class="text-slate-700 text-sm space-y-2">
            <p>✅ 在线无水印短视频下载工具，依托短视频解析聚合API，解析短视频分享链接，获取无水印视频资源。</p>
            <p>✅ 支持多接口切换，后续会持续新增更多解析接口。</p>
            <p>✅ 仅用于个人学习预览，请勿商用，下载内容版权归原作者所有。</p>
            <p>📄 API文档地址：<a href="https://api-new.ifphp.com/docs/5#online-test" target="_blank" class="text-primary underline">https://api-new.ifphp.com/docs/5#online-test</a></p>
        </div>
        <div class="flex justify-end mt-4">
            <button id="closeAboutModal" class="px-4 py-2 border rounded-lg hover:bg-slate-100">关闭</button>
        </div>
    </div>
</div>

<script>
// 接口配置列表，后续新增接口在这里追加即可
const apiList = [
    {
        name: "短视频解析聚合",
        baseUrl: "https://api-new.ifphp.com",
        key: "bp_live_a29d5a45d8554cc75c8cacae731f42360479d20076e3ef8b2a734a078618292f"
    }
];
let selectedApiIndex = 0;

// DOM元素
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
const changeApiBtn = document.getElementById('changeApiBtn');
const aboutBtn = document.getElementById('aboutBtn');
const modalMask = document.getElementById('modalMask');
const apiModal = document.getElementById('apiModal');
const aboutModal = document.getElementById('aboutModal');
const closeApiModal = document.getElementById('closeApiModal');
const closeAboutModal = document.getElementById('closeAboutModal');
const apiListBox = document.getElementById('apiListBox');
const currentApiName = document.getElementById('currentApiName');

const videoUrlInput = document.getElementById('videoUrlInput');
const parseBtn = document.getElementById('parseBtn');
const loadingTip = document.getElementById('loadingTip');
const resultBox = document.getElementById('resultBox');
const coverImg = document.getElementById('coverImg');
const videoTitle = document.getElementById('videoTitle');
const videoAuthor = document.getElementById('videoAuthor');
const downloadBtn = document.getElementById('downloadBtn');

// 渲染接口列表
function renderApiList() {
    apiListBox.innerHTML = "";
    apiList.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `p-3 border rounded-lg cursor-pointer ${idx === selectedApiIndex ? 'border-primary bg-blue-50' : 'hover:bg-slate-50'}`;
        div.innerText = item.name;
        div.onclick = () => {
            selectedApiIndex = idx;
            currentApiName.innerText = apiList[selectedApiIndex].name;
            renderApiList();
        }
        apiListBox.appendChild(div);
    })
}
renderApiList();

// 三点菜单展开收起
menuBtn.onclick = (e) => {
    e.stopPropagation();
    menuPanel.classList.toggle('hidden');
};
document.body.onclick = () => {
    menuPanel.classList.add('hidden');
};

// 打开弹窗
changeApiBtn.onclick = () => {
    menuPanel.classList.add('hidden');
    modalMask.classList.remove('hidden');
    apiModal.classList.remove('hidden');
}
aboutBtn.onclick = () => {
    menuPanel.classList.add('hidden');
    modalMask.classList.remove('hidden');
    aboutModal.classList.remove('hidden');
}
// 关闭弹窗
closeApiModal.onclick = ()=>{
    modalMask.classList.add('hidden');
    apiModal.classList.add('hidden');
}
closeAboutModal.onclick = ()=>{
    modalMask.classList.add('hidden');
    aboutModal.classList.add('hidden');
}
modalMask.onclick = (e)=>{
    if(e.target === modalMask){
        modalMask.classList.add('hidden');
        apiModal.classList.add('hidden');
        aboutModal.classList.add('hidden');
    }
}

// 解析按钮逻辑
parseBtn.onclick = async ()=>{
    const link = videoUrlInput.value.trim();
    if(!link){
        alert("请粘贴短视频分享链接");
        return;
    }
    const apiItem = apiList[selectedApiIndex];
    loadingTip.classList.remove('hidden');
    resultBox.classList.add('hidden');

    try {
        // ===== 这里根据接口文档修改请求方式/参数，当前预留请求模板 =====
        // 你可以对照文档调整请求method、header、body
        const res = await fetch(`${apiItem.baseUrl}/xxx?key=${apiItem.key}&url=${encodeURIComponent(link)}`, {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                url: link,
                key: apiItem.key
            })
        })
        const data = await res.json();
        console.log("接口返回：", data);

        // ========== 解析结果渲染（根据API返回字段修改这里）==========
        // 下面字段需要你对照接口文档替换成真实返回字段
        if(data.code === 200 || data.success){
            videoTitle.innerText = data.data?.title || "无标题";
            videoAuthor.innerText = data.data?.author || "";
            coverImg.src = data.data?.cover || "";
            downloadBtn.href = data.data?.video_url || "";
            resultBox.classList.remove('hidden');
        }else{
            alert(data.msg || "解析失败");
        }
    } catch (err) {
        console.error(err);
        alert("请求异常，大概率跨域CORS问题，请部署到静态站点后使用");
    } finally {
        loadingTip.classList.add('hidden');
    }
}
</script>
</body>
</html>
