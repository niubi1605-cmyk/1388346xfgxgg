<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万能小工具箱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0d14;--panel:#12161f;--panel2:#171c28;--border:#232a38;--text:#e8ecf4;--muted:#7a8499;--blue:#4f8cff;--purple:#a855f7;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

.app{display:flex;min-height:100vh}
.sidebar{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-size:20px;flex:0 0 38px}
.brand h1{font-size:14px;font-weight:700}
.brand p{font-size:11px;color:var(--muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-group{margin-bottom:14px}
.nav-title{font-size:10.5px;color:var(--muted);padding:8px 10px;letter-spacing:1px;font-weight:600}
.nav-item{padding:9px 12px;border-radius:8px;font-size:13px;color:#b8c2d6;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:#1a2130;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(79,140,255,.18),transparent);color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.nav-item .ic{font-size:15px;width:18px;text-align:center;flex:0 0 18px}
.footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;padding:0 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:rgba(10,13,20,.85);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
#menuBtn{display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:6px}
.crumb{flex:1;font-size:15px;font-weight:600}
.badge{font-size:11.5px;padding:5px 12px;border-radius:20px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#7ee2a8}
.content{padding:24px;max-width:1000px;width:100%;margin:0 auto;flex:1}

.hero{background:linear-gradient(135deg,rgba(79,140,255,.15),rgba(168,85,247,.1));border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:24px}
.hero h2{font-size:24px;font-weight:700;margin-bottom:8px}
.hero h2 span{background:linear-gradient(135deg,#5ac8fa,#bf5af2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:13.5px;color:var(--muted);line-height:1.7;max-width:560px}
.stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stat b{font-size:22px;font-weight:700;display:block}
.stat span{font-size:11px;color:var(--muted);margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.18s}
.card:hover{background:var(--panel2);border-color:#33405a;transform:translateY(-2px)}
.card .icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;margin-bottom:10px;background:linear-gradient(135deg,rgba(79,140,255,.2),rgba(168,85,247,.2))}
.card .name{font-size:13.5px;font-weight:600;margin-bottom:4px}
.card .desc{font-size:11.5px;color:var(--muted);line-height:1.5}
.card .new-badge{position:absolute;font-size:9px;padding:2px 7px;border-radius:20px;background:linear-gradient(135deg,#ff375f,#ff9f0a);color:#fff;font-weight:700;margin-left:6px}

.panel{position:fixed;inset:0;background:rgba(10,13,20,.9);backdrop-filter:blur(20px);z-index:100;display:none;overflow-y:auto}
.panel.on{display:block}
.panel-inner{max-width:820px;margin:0 auto;padding:20px 20px 80px}
.panel-bar{display:flex;align-items:center;gap:12px;padding:12px 0;position:sticky;top:0;background:rgba(10,13,20,.95);backdrop-filter:blur(10px);z-index:5;margin-bottom:16px}
.btn-back{padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--border);font-size:13px;cursor:pointer;font-weight:600}
.btn-back:hover{background:var(--panel2)}
.panel-title{font-size:16px;font-weight:700;flex:1}
.panel-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px}

.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.box-title{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.label{display:block;font-size:12.5px;color:#a8b3c7;margin-bottom:6px;font-weight:500}
.input,.select,.textarea{width:100%;background:#0a0e16;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13.5px;outline:none;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
.textarea{resize:vertical;line-height:1.6;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.field{margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{background:#1d2534}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--blue),#6a5cff);border:none;color:#fff;box-shadow:0 4px 12px rgba(79,140,255,.3)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#ff8080}
.drop{border:2px dashed #2e384c;border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;background:#0a0e16;transition:.2s}
.drop:hover{border-color:#41506b;background:#0d121c}
.drop .di{font-size:30px;margin-bottom:10px}
.drop .dt{font-size:14px;font-weight:600;margin-bottom:6px}
.drop .ds{font-size:11.5px;color:var(--muted)}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0e16;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;font-size:12.5px}
.file-item .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fs{color:var(--muted);font-size:11px}
.file-item .fx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.file-item .fx:hover{color:var(--red)}
.result{margin-top:12px;padding:12px 14px;background:#0a0e16;border:1px solid var(--border);border-radius:9px;font-size:12.5px;line-height:1.7;word-break:break-all}
.result.ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.06);color:#a8f0bd}
.result.err{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.06);color:#ffb0b0}
.result.info{border-color:rgba(79,140,255,.35);background:rgba(79,140,255,.06);color:#9fc2ff}
.result.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.06);color:#ffd08a}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.bar{height:4px;background:#1a2130;border-radius:2px;overflow:hidden;margin-top:12px;display:none}
.bar.on{display:block}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .2s}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;background:#1b2231;border:1px solid #2c3648;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s ease;max-width:80vw;text-align:center}
.toast.ok{border-color:rgba(34,197,94,.5)}
.toast.err{border-color:rgba(239,68,68,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.mask.on{display:block}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:rgba(79,140,255,.15);color:#9fc2ff;margin-left:6px}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;width:250px;z-index:95}
  .sidebar.on{transform:none}
  #menuBtn{display:block}
  .content{padding:16px}
  .panel-inner{padding:12px 12px 60px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🧰</div>
      <div>
        <h1>万能小工具箱</h1>
        <p>稳定版 · 本地处理</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="footer"><span class="dot"></span>100% 本地 · 数据不上传</div>
  </aside>
  <div class="mask" id="mask"></div>

  <main class="main">
    <div class="topbar">
      <button id="menuBtn">☰</button>
      <div class="crumb" id="crumb">首页</div>
      <div class="badge">🔒 本地处理</div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="panel-bar">
      <button class="btn-back" id="panelBack">← 返回</button>
      <div class="panel-icon" id="panelIcon"></div>
      <div class="panel-title" id="panelTitle"></div>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

<script>
/* =========================================================
   基础工具
   ========================================================= */
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function formatSize(n){
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if(n < 1073741824) return (n/1048576).toFixed(2) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function showToast(msg, type){
  var wrap = document.getElementById('toastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toastWrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast('已复制', 'ok');
    }).catch(function(){ fallback(text); });
  } else { fallback(text); }
  function fallback(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制', 'ok'); }
    catch(e){ showToast('复制失败', 'err'); }
    ta.remove();
  }
}
function setupDrop(zone, input, onFiles){
  zone.onclick = function(){ input.click(); };
  input.onchange = function(){
    if(input.files.length) onFiles(Array.prototype.slice.call(input.files));
    input.value = '';
  };
  zone.ondragover = function(e){ e.preventDefault(); zone.style.borderColor = 'var(--blue)'; };
  zone.ondragleave = function(){ zone.style.borderColor = ''; };
  zone.ondrop = function(e){
    e.preventDefault();
    zone.style.borderColor = '';
    var f = Array.prototype.slice.call(e.dataTransfer.files || []);
    if(f.length) onFiles(f);
  };
}
function fileListHtml(files){
  return files.map(function(f, i){
    return '<div class="file-item"><span class="fn">' + escapeHtml(f.name) + '</span><span class="fs">' + formatSize(f.size) + '</span><button class="fx" data-i="' + i + '">✕</button></div>';
  }).join('');
}
function compressImage(file, maxSize, quality){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(Math.max(w, h) > maxSize){
        var s = maxSize / Math.max(w, h);
        w = Math.round(w * s);
        h = Math.round(h * s);
      }
      var cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function(blob){
        if(!blob){ reject(new Error('压缩失败')); return; }
        var r = new FileReader();
        r.onload = function(){ resolve(r.result); };
        r.onerror = function(){ reject(new Error('读取失败')); };
        r.readAsDataURL(blob);
      }, 'image/jpeg', quality || 0.7);
    };
    img.onerror = function(){ reject(new Error('图片解析失败')); };
    img.src = URL.createObjectURL(file);
  });
}
function fetchTimeout(url, options, ms){
  options = options || {};
  ms = ms || 15000;
  return new Promise(function(resolve, reject){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); reject(new Error('请求超时')); }, ms);
    fetch(url, Object.assign({}, options, { signal: ctrl.signal }))
      .then(function(r){ clearTimeout(timer); resolve(r); })
      .catch(function(e){ clearTimeout(timer); reject(e); });
  });
}
function bytesToBase64(bytes){
  var bin = '';
  var CHUNK = 0x8000;
  for(var i = 0; i < bytes.length; i += CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
function base64ToBytes(b64){
  var bin = atob(b64.replace(/\s/g, ''));
  var u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function genId(){
  var t = Date.now().toString(16);
  var r1 = Math.random().toString(16).slice(2, 10);
  var r2 = Math.random().toString(16).slice(2, 10);
  return t + r1 + r2;
}

/* =========================================================
   工具定义
   ========================================================= */
var TOOLS = [];
var CATEGORIES = {
  crypto: { name: '加密存储', icon: '🔐' },
  video: { name: '视频工具', icon: '🎬' },
  image: { name: '图片工具', icon: '🖼️' },
  text: { name: '文本工具', icon: '📝' },
  life: { name: '实用工具', icon: '🧰' }
};

/* =========================================================
   工具 1: 私人播客生成器
   ========================================================= */
var POD_KEY = 'toolbox_podcast_draft';
var POD_LIST = 'toolbox_podcast_list';

function loadPodList(){
  try { return JSON.parse(localStorage.getItem(POD_LIST) || '{}'); }
  catch(e){ return {}; }
}
function savePodList(obj){
  try { localStorage.setItem(POD_LIST, JSON.stringify(obj)); } catch(e){}
}

TOOLS.push({
  id: 'podcast',
  name: '私人播客生成器',
  icon: '🎙️',
  category: 'crypto',
  desc: '生成专属链接，实时可编辑',
  isNew: true,
  render: function(root){
    var hash = location.hash;

    // 查看模式
    if(hash.indexOf('#podcast=') === 0){
      renderPodcastView(root, hash.slice(9));
      return;
    }
    // 编辑模式
    if(hash.indexOf('#podcast-edit=') === 0){
      var rest = hash.slice(14);
      var dashIdx = rest.lastIndexOf('-');
      if(dashIdx > 0){
        renderPodcastEdit(root, rest.slice(0, dashIdx), rest.slice(dashIdx + 1));
        return;
      }
    }
    // 创建模式
    renderPodcastCreate(root);
  }
});

function renderPodcastCreate(root){
  var html = '';
  html += '<div class="box" style="background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(79,140,255,.08));border-color:rgba(168,85,247,.3)">';
  html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:22px">🎙️</span><span style="font-size:15px;font-weight:700">私人播客生成器</span></div>';
  html += '<div style="font-size:12.5px;color:var(--muted);line-height:1.75">编辑内容 → 生成专属链接 → 发给朋友。<br><b style="color:var(--text)">浏览链接</b>给朋友看，<b style="color:var(--text)">管理链接</b>你自己留着改。改完保存，朋友刷新自动同步。</div>';
  html += '</div>';

  html += '<div class="box">';
  html += '<div class="box-title">📻 播客基础信息</div>';
  html += '<div class="grid2">';
  html += '<div class="field"><label class="label">播客名称（必填）</label><input type="text" class="input" id="podName" placeholder="例如：我的电台"></div>';
  html += '<div class="field"><label class="label">播客作者（可选）</label><input type="text" class="input" id="podAuthor" placeholder="你的名字"></div>';
  html += '</div>';
  html += '<div class="field"><label class="label">播客简介（可选）</label><textarea class="textarea" id="podDesc" rows="3" placeholder="简单介绍一下…"></textarea></div>';
  html += '<div class="field"><label class="label">播客封面（可选，会自动压缩）</label>';
  html += '<input type="file" id="podCover" accept="image/*" hidden>';
  html += '<div class="row"><button class="btn" id="pickCoverBtn">📷 选择封面</button><button class="btn btn-ghost" id="removeCoverBtn" style="display:none">🗑️ 移除</button><span class="hint" id="coverName" style="margin-top:0">不选也行</span></div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="box">';
  html += '<div class="box-title">📝 添加单集</div>';
  html += '<div class="grid2">';
  html += '<div class="field"><label class="label">单集标题（必填）</label><input type="text" class="input" id="epTitle" placeholder="例如：第 1 期 · 开场"></div>';
  html += '<div class="field"><label class="label">单集简介（可选）</label><input type="text" class="input" id="epDesc" placeholder="可留空"></div>';
  html += '</div>';
  html += '<div class="field"><label class="label">单集文字稿（可选）</label><textarea class="textarea" id="epContent" rows="5" placeholder="像写文章一样写你的播客内容…"></textarea></div>';
  html += '<div class="field"><label class="label">视频链接（可选）</label><input type="text" class="input" id="epVideo" placeholder="支持 .mp4 / .m3u8 / 云盘直链等"></div>';
  html += '<div class="hint">💡 M3U8 链接只有几十字符，不会撑爆数据。数据上限 900KB，通常是文字稿太多会超。</div>';
  html += '<div id="sizeInfo" style="margin-top:12px"></div>';
  html += '<div class="row" style="margin-top:12px"><button class="btn btn-primary" id="addEpBtn">➕ 添加单集</button></div>';
  html += '</div>';

  html += '<div class="box">';
  html += '<div class="box-title">📋 单集列表 <span id="epCount" style="font-size:11.5px;color:var(--muted);font-weight:500;margin-left:auto"></span></div>';
  html += '<div id="epList"></div>';
  html += '<div id="epEmpty" class="hint" style="text-align:center;padding:20px">还没有单集，添加第一期吧</div>';
  html += '</div>';

  html += '<div class="box">';
  html += '<div class="box-title">🔗 生成专属链接</div>';
  html += '<div class="hint" style="margin-bottom:12px">生成后会给你两个链接：<b style="color:#7ee2a8">浏览链接</b>（给朋友）和 <b style="color:#ffd28a">管理链接</b>（自己改）。</div>';
  html += '<div class="row"><button class="btn btn-primary" id="genLinkBtn">🔗 生成专属链接</button></div>';
  html += '<div id="linkResult"></div>';
  html += '</div>';

  html += '<div class="box">';
  html += '<div class="box-title">📚 我的播客</div>';
  html += '<div id="myPodList"></div>';
  html += '</div>';

  root.innerHTML = html;

  var episodes = [];
  var coverData = null;

  // 加载草稿
  try {
    var draft = JSON.parse(localStorage.getItem(POD_KEY) || 'null');
    if(draft){
      root.querySelector('#podName').value = draft.name || '';
      root.querySelector('#podAuthor').value = draft.author || '';
      root.querySelector('#podDesc').value = draft.desc || '';
      episodes = draft.episodes || [];
      coverData = draft.coverData || null;
      if(coverData){
        root.querySelector('#coverName').textContent = '已保存封面';
        root.querySelector('#removeCoverBtn').style.display = '';
      }
    }
  } catch(e){}

  function calcSize(data){
    function sz(s){ return s ? new Blob([s]).size : 0; }
    var total = sz(data.name) + sz(data.author) + sz(data.desc);
    if(data.coverData) total += data.coverData.length;
    (data.episodes || []).forEach(function(ep){
      total += sz(ep.title) + sz(ep.desc) + sz(ep.content) + sz(ep.videoUrl);
    });
    return total;
  }

  function updateSize(){
    var data = {
      name: root.querySelector('#podName').value,
      author: root.querySelector('#podAuthor').value,
      desc: root.querySelector('#podDesc').value,
      coverData: coverData,
      episodes: episodes
    };
    var sz = calcSize(data);
    var pct = Math.min(100, sz / (900 * 1024) * 100);
    var col = sz > 800 * 1024 ? '#ef4444' : sz > 600 * 1024 ? '#f59e0b' : '#22c55e';
    var sizeInfo = root.querySelector('#sizeInfo');
    if(sizeInfo){
      sizeInfo.innerHTML = '<div style="font-size:11.5px;color:var(--muted);margin-bottom:6px">📊 数据占用：' + formatSize(sz) + ' / 900 KB</div><div style="height:5px;background:#1a2130;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + col + ';border-radius:3px;transition:width .2s"></div></div>';
    }
  }

  function renderEpList(){
    var listEl = root.querySelector('#epList');
    var emptyEl = root.querySelector('#epEmpty');
    var countEl = root.querySelector('#epCount');
    if(!listEl) return;
    countEl.textContent = episodes.length ? '共 ' + episodes.length + ' 期' : '';
    if(episodes.length === 0){
      listEl.innerHTML = '';
      if(emptyEl) emptyEl.style.display = 'block';
      updateSize();
      return;
    }
    if(emptyEl) emptyEl.style.display = 'none';
    var h = '';
    for(var i = 0; i < episodes.length; i++){
      var ep = episodes[i];
      h += '<div class="file-item" style="padding:12px 14px;align-items:flex-start">';
      h += '<div style="width:36px;height:36px;border-radius:9px;background:rgba(168,85,247,.15);display:grid;place-items:center;flex:0 0 36px">🎙️</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-size:13px;font-weight:600;margin-bottom:4px">第 ' + (i+1) + ' 期 · ' + escapeHtml(ep.title) + '</div>';
      if(ep.desc) h += '<div style="font-size:11.5px;color:var(--muted);margin-bottom:4px">' + escapeHtml(ep.desc) + '</div>';
      if(ep.content) h += '<div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(ep.content.slice(0, 60)) + (ep.content.length > 60 ? '…' : '') + '</div>';
      if(ep.videoUrl) h += '<div style="font-size:11px;color:#9fc2ff;margin-top:4px">🎬 ' + escapeHtml(ep.videoUrl.slice(0, 50)) + (ep.videoUrl.length > 50 ? '…' : '') + '</div>';
      h += '<div style="margin-top:6px"><button class="btn btn-sm btn-danger" data-del="' + i + '">🗑️ 删除</button></div>';
      h += '</div>';
      h += '</div>';
    }
    listEl.innerHTML = h;
    var delBtns = listEl.querySelectorAll('[data-del]');
    for(var j = 0; j < delBtns.length; j++){
      delBtns[j].onclick = function(e){
        var idx = parseInt(e.target.getAttribute('data-del'), 10);
        episodes.splice(idx, 1);
        saveDraft();
        renderEpList();
      };
    }
    updateSize();
  }

  function saveDraft(){
    try {
      localStorage.setItem(POD_KEY, JSON.stringify({
        name: root.querySelector('#podName').value,
        author: root.querySelector('#podAuthor').value,
        desc: root.querySelector('#podDesc').value,
        coverData: coverData,
        episodes: episodes
      }));
    } catch(e){}
  }

  root.querySelector('#pickCoverBtn').onclick = function(){
    root.querySelector('#podCover').click();
  };
  root.querySelector('#podCover').onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    root.querySelector('#coverName').textContent = '压缩中…';
    compressImage(f, 400, 0.7).then(function(d){
      coverData = d;
      root.querySelector('#coverName').textContent = '已选择';
      root.querySelector('#removeCoverBtn').style.display = '';
      updateSize();
    }).catch(function(err){
      root.querySelector('#coverName').textContent = '处理失败';
      showToast('封面处理失败：' + err.message, 'err');
    });
  };
  root.querySelector('#removeCoverBtn').onclick = function(){
    coverData = null;
    root.querySelector('#coverName').textContent = '不选也行';
    root.querySelector('#removeCoverBtn').style.display = 'none';
    updateSize();
  };

  ['podName', 'podAuthor', 'podDesc'].forEach(function(id){
    var el = root.querySelector('#' + id);
    if(el) el.addEventListener('input', updateSize);
  });

  root.querySelector('#addEpBtn').onclick = function(){
    var title = root.querySelector('#epTitle').value.trim();
    if(!title){ showToast('请输入单集标题', 'err'); return; }
    episodes.push({
      title: title,
      desc: root.querySelector('#epDesc').value.trim(),
      content: root.querySelector('#epContent').value.trim(),
      videoUrl: root.querySelector('#epVideo').value.trim()
    });
    root.querySelector('#epTitle').value = '';
    root.querySelector('#epDesc').value = '';
    root.querySelector('#epContent').value = '';
    root.querySelector('#epVideo').value = '';
    saveDraft();
    renderEpList();
    showToast('已添加', 'ok');
  };

  root.querySelector('#genLinkBtn').onclick = function(){
    if(episodes.length === 0){ showToast('请至少添加一期内容', 'err'); return; }
    var btn = root.querySelector('#genLinkBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 上传中…';

    var secret = genId();
    var data = {
      n: root.querySelector('#podName').value || '我的播客',
      a: root.querySelector('#podAuthor').value,
      d: root.querySelector('#podDesc').value,
      c: coverData,
      s: secret,
      e: episodes,
      u: Date.now()
    };
    var json = JSON.stringify(data);
    var sizeKB = (json.length / 1024).toFixed(1);

    if(json.length > 900 * 1024){
      btn.disabled = false;
      btn.textContent = '🔗 生成专属链接';
      showToast('数据过大：' + sizeKB + 'KB，请减少文字稿或期数', 'err');
      root.querySelector('#linkResult').innerHTML = '<div class="result err">❌ 数据过大：' + sizeKB + 'KB / 上限 900KB<br><br>建议：<br>• 减少每期文字稿字数<br>• 减少单集数量<br>• 移除封面<br><br>提示：视频链接只有几十字符，不占空间</div>';
      return;
    }

    // 尝试上传到 jsonblob
    fetchTimeout('https://jsonblob.com/api/jsonBlob', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: json
    }, 20000).then(function(res){
      if(!res.ok) throw new Error('服务器返回 ' + res.status);
      var loc = res.headers.get('Location') || res.headers.get('location');
      if(!loc) throw new Error('未获取到存储 ID');
      return loc.split('/').pop();
    }).then(function(blobId){
      var base = location.origin + location.pathname;
      var viewLink = base + '#podcast=' + blobId;
      var editLink = base + '#podcast-edit=' + blobId + '-' + secret;

      var my = loadPodList();
      my[blobId] = { name: data.n, created: Date.now(), secret: secret, viewLink: viewLink, editLink: editLink };
      savePodList(my);

      root.querySelector('#linkResult').innerHTML =
        '<div class="result ok" style="margin-top:14px">✅ 生成成功（' + sizeKB + 'KB / 900KB）</div>' +
        '<div style="background:#0a0e16;border:1px solid rgba(34,197,94,.4);border-radius:9px;padding:12px 14px;margin-top:10px;word-break:break-all">' +
        '<div style="font-size:11.5px;color:#7ee2a8;font-weight:700;margin-bottom:6px">📤 浏览链接（发朋友）</div>' +
        '<div class="mono" style="color:#9fc2ff;line-height:1.6">' + escapeHtml(viewLink) + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="btn btn-sm btn-primary" id="cpView">📋 复制</button><button class="btn btn-sm" id="opView">👁️ 预览</button></div>' +
        '</div>' +
        '<div style="background:#0a0e16;border:1px solid rgba(245,158,11,.4);border-radius:9px;padding:12px 14px;margin-top:10px;word-break:break-all">' +
        '<div style="font-size:11.5px;color:#ffd08a;font-weight:700;margin-bottom:6px">✏️ 管理链接（自己留）</div>' +
        '<div class="mono" style="color:#9fc2ff;line-height:1.6">' + escapeHtml(editLink) + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="btn btn-sm btn-primary" id="cpEdit">📋 复制</button><button class="btn btn-sm" id="opEdit">✏️ 打开管理</button></div>' +
        '</div>';

      root.querySelector('#cpView').onclick = function(){ copyToClipboard(viewLink); };
      root.querySelector('#opView').onclick = function(){ window.open(viewLink, '_blank'); };
      root.querySelector('#cpEdit').onclick = function(){ copyToClipboard(editLink); };
      root.querySelector('#opEdit').onclick = function(){ location.hash = '#podcast-edit=' + blobId + '-' + secret; };

      renderMyPodList(root);
      showToast('生成成功', 'ok');
    }).catch(function(e){
      console.error(e);
      showToast('上传失败：' + e.message, 'err');
      root.querySelector('#linkResult').innerHTML =
        '<div class="result err">❌ 生成失败：' + escapeHtml(e.message) + '<br><br>' +
        '<b>可能原因：</b><br>' +
        '① 网络问题（无法连接 jsonblob.com）<br>' +
        '② 浏览器拦截了跨域请求<br>' +
        '③ 存储服务暂时不可用<br><br>' +
        '<b>建议：</b><br>' +
        '• 检查网络连接<br>' +
        '• 稍后重试<br>' +
        '• 如果一直失败，可能是网络环境屏蔽了该服务</div>';
    }).then(function(){
      btn.disabled = false;
      btn.textContent = '🔗 生成专属链接';
    });
  };

  renderEpList();
  renderMyPodList(root);
  updateSize();
}

function renderMyPodList(root){
  var el = root.querySelector('#myPodList');
  if(!el) return;
  var my = loadPodList();
  var ids = Object.keys(my);
  if(ids.length === 0){
    el.innerHTML = '<div class="hint" style="text-align:center;padding:20px">还没有创建过播客</div>';
    return;
  }
  ids.sort(function(a, b){ return my[b].created - my[a].created; });
  var h = '';
  for(var i = 0; i < ids.length; i++){
    var id = ids[i];
    var m = my[id];
    h += '<div class="file-item" style="padding:12px 14px;align-items:flex-start">';
    h += '<div style="width:36px;height:36px;border-radius:9px;background:rgba(79,140,255,.15);display:grid;place-items:center;flex:0 0 36px">🎙️</div>';
    h += '<div style="flex:1;min-width:0">';
    h += '<div style="font-size:13px;font-weight:600;margin-bottom:4px">' + escapeHtml(m.name) + '</div>';
    h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">创建于 ' + new Date(m.created).toLocaleString('zh-CN') + '</div>';
    h += '<div class="row">';
    h += '<button class="btn btn-sm btn-primary" data-act="open" data-url="' + escapeHtml(m.viewLink) + '">📤 打开</button>';
    h += '<button class="btn btn-sm" data-act="edit" data-url="' + escapeHtml(m.editLink) + '">✏️ 管理</button>';
    h += '<button class="btn btn-sm" data-act="copy" data-url="' + escapeHtml(m.viewLink) + '">📋 复制</button>';
    h += '<button class="btn btn-sm btn-danger" data-act="del" data-id="' + id + '">🗑️ 删除</button>';
    h += '</div>';
    h += '</div>';
    h += '</div>';
  }
  el.innerHTML = h;

  var btns = el.querySelectorAll('button[data-act]');
  for(var j = 0; j < btns.length; j++){
    btns[j].onclick = function(e){
      var act = e.target.getAttribute('data-act');
      if(act === 'open') window.open(e.target.getAttribute('data-url'), '_blank');
      else if(act === 'edit') location.hash = e.target.getAttribute('data-url').replace(/^[^#]*/, '');
      else if(act === 'copy') copyToClipboard(e.target.getAttribute('data-url'));
      else if(act === 'del'){
        if(!confirm('从本机删除这条记录？')) return;
        var my = loadPodList();
        delete my[e.target.getAttribute('data-id')];
        savePodList(my);
        renderMyPodList(root);
      }
    };
  }
}

function renderPodcastView(root, blobId){
  root.innerHTML = '<div style="text-align:center;padding:60px 20px"><div style="font-size:48px;margin-bottom:16px">🎙️</div><div style="font-size:14px;color:var(--muted)">正在加载播客…</div></div>';

  fetchTimeout('https://jsonblob.com/api/jsonBlob/' + blobId, {}, 15000).then(function(r){
    if(!r.ok) throw new Error('读取失败 ' + r.status);
    return r.json();
  }).then(function(data){
    drawPodcastView(root, blobId, data);
    // 轮询更新
    var timer = setInterval(function(){
      fetchTimeout('https://jsonblob.com/api/jsonBlob/' + blobId, {}, 15000)
        .then(function(r){ return r.json(); })
        .then(function(nd){
          if(nd.u !== data.u){
            data = nd;
            drawPodcastView(root, blobId, nd);
            showToast('内容已更新', 'ok');
          }
        })
        .catch(function(){});
    }, 20000);
    if(root._podTimer) clearInterval(root._podTimer);
    root._podTimer = timer;
  }).catch(function(e){
    root.innerHTML = '<div class="box"><div class="result err">❌ 加载失败：' + escapeHtml(e.message) + '<br><br>可能原因：<br>① 网络问题<br>② 存储服务暂时不可用<br>③ 链接已失效</div></div>';
  });
}

function drawPodcastView(root, blobId, data){
  var h = '';
  h += '<div style="max-width:820px;margin:0 auto">';
  h += '<div style="text-align:center;padding:36px 24px;border-radius:16px;background:linear-gradient(135deg,rgba(79,140,255,.15),rgba(168,85,247,.12));border:1px solid var(--border);margin-bottom:20px">';
  h += '<div style="margin-bottom:14px"><span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);color:#7ee2a8;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e"></span>实时同步</span></div>';
  if(data.c){
    h += '<img src="' + data.c + '" style="width:130px;height:130px;border-radius:24px;object-fit:cover;margin:0 auto 18px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.4)">';
  } else {
    h += '<div style="width:130px;height:130px;border-radius:24px;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(79,140,255,.3));margin:0 auto 18px;display:grid;place-items:center;font-size:56px">🎙️</div>';
  }
  h += '<div style="font-size:28px;font-weight:700;margin-bottom:8px">' + escapeHtml(data.n || '未命名') + '</div>';
  if(data.a) h += '<div style="font-size:14px;color:var(--muted);margin-bottom:8px">by ' + escapeHtml(data.a) + '</div>';
  if(data.d) h += '<div style="font-size:13px;color:var(--muted);max-width:520px;margin:0 auto;line-height:1.75">' + escapeHtml(data.d) + '</div>';
  h += '<div class="hint" style="margin-top:14px;font-size:11px">更新于 ' + (data.u ? new Date(data.u).toLocaleString('zh-CN') : '未知') + '</div>';
  h += '</div>';

  var eps = data.e || [];
  if(eps.length === 0){
    h += '<div class="hint" style="text-align:center;padding:30px">暂无内容</div>';
  } else {
    for(var i = 0; i < eps.length; i++){
      var ep = eps[i];
      h += '<div class="box">';
      h += '<div style="font-size:17px;font-weight:700;margin-bottom:8px">第 ' + (i+1) + ' 期 · ' + escapeHtml(ep.t || '') + '</div>';
      if(ep.d) h += '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">' + escapeHtml(ep.d) + '</div>';
      if(ep.c) h += '<div style="font-size:14.5px;line-height:1.9;color:#b8c2d6;white-space:pre-wrap;margin-bottom:16px">' + escapeHtml(ep.c) + '</div>';
      if(ep.v){
        var u = ep.v.toLowerCase().split('?')[0];
        if(u.indexOf('.m3u8') >= 0){
          h += '<div style="padding:14px 16px;background:rgba(79,140,255,.08);border:1px solid rgba(79,140,255,.3);border-radius:10px;font-size:12.5px;color:#9fc2ff;display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
          h += '<span>📺 M3U8 流媒体</span>';
          h += '<a href="' + escapeHtml(ep.v) + '" target="_blank" class="btn btn-sm btn-primary">▶ 打开播放</a>';
          h += '<button class="btn btn-sm" data-cpv="' + escapeHtml(ep.v) + '">📋 复制链接</button>';
          h += '</div>';
          h += '<div class="hint" style="margin-top:6px">💡 浏览器如不能播放，可复制链接到 VLC / IINA 播放</div>';
        } else {
          h += '<video src="' + escapeHtml(ep.v) + '" controls preload="metadata" style="width:100%;border-radius:12px;margin-bottom:12px;background:#000"></video>';
        }
      }
      h += '</div>';
    }

      copyToClipboard(e.target.getAttribute('data-cpv'));
    };
  }
}

function renderPodcastEdit(root, blobId, secret){
  root.innerHTML = '<div style="text-align:center;padding:60px 20px"><div style="font-size:48px;margin-bottom:16px">✏️</div><div style="font-size:14px;color:var(--muted)">正在打开管理台…</div></div>';

  fetchTimeout('https://jsonblob.com/api/jsonBlob/' + blobId, {}, 15000).then(function(r){
    if(!r.ok) throw new Error('读取失败 ' + r.status);

  }).then(function(data){
    if(data.s !== secret){
      root.innerHTML = '<div class="box"><div class="result err">❌ 管理密钥错误，无法进入</div></div>';
      return;
    }
    drawPodcastEdit(root, blobId, secret, data);
  }).catch(function(e){
    root.innerHTML = '<div class="box"><div class="result err">❌ 打开失败：' + escapeHtml(e.message) + '</div></div>';
  });
}

function drawPodcastEdit(root, blobId, secret, data){
  var episodes = (data.e || []).map(function(ep){ return JSON.parse(JSON.stringify(ep)); });
  var coverData = data.c || null;
  var podName = data.n || '';
  var podAuthor = data.a || '';
  var podDesc = data.d || '';
  var viewLink = location.origin + location.pathname + '#podcast=' + blobId;

  var h = '';
  h += '<div style="background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(239,68,68,.12));border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:13px;color:#ffd08a;line-height:1.6">';
  h += '<b>✏️ 管理台模式</b>：修改保存后朋友刷新就能看到。';
  h += '</div>';

  h += '<div class="box">';
  h += '<div class="box-title">🔗 当前浏览链接</div>';
  h += '<div style="background:#0a0e16;border:1px solid var(--border);border-radius:9px;padding:12px 14px;word-break:break-all">';
  h += '<div class="mono" style="color:#9fc2ff;line-height:1.6">' + escapeHtml(viewLink) + '</div>';
  h += '<div class="row" style="margin-top:8px"><button class="btn btn-sm" id="editCopyView">📋 复制</button><button class="btn btn-sm" id="editOpenView">👁️ 预览</button></div>';
  h += '</div>';
  h += '</div>';

  h += '<div class="box">';
  h += '<div class="box-title">📻 基础信息</div>';
  h += '<div class="grid2">';
  h += '<div class="field"><label class="label">播客名称</label><input type="text" class="input" id="edName" value="' + escapeHtml(podName) + '"></div>';
  h += '<div class="field"><label class="label">作者</label><input type="text" class="input" id="edAuthor" value="' + escapeHtml(podAuthor) + '"></div>';
  h += '</div>';
  h += '<div class="field"><label class="label">简介</label><textarea class="textarea" id="edDesc" rows="3">' + escapeHtml(podDesc) + '</textarea></div>';

function renderHostView(root, payloadB64){
  if(!window.crypto || !window.crypto.subtle){
    root.innerHTML = '<div class="box"><div class="result err">❌ 当前环境不支持 Web Crypto，无法解密。请通过 HTTPS 访问。</div></div>';
    return;
  }
  var payload;
  try {
    payload = JSON.parse(new TextDecoder().decode(base64ToBytes(payloadB64)));
  } catch(e){
    root.innerHTML = '<div class="box"><div class="result err">❌ 链接无效或已损坏</div></div>';
    return;
  }

  if(payload.e && Date.now() > payload.e){
    root.innerHTML = '<div style="max-width:600px;margin:60px auto;text-align:center"><div style="font-size:52px;margin-bottom:16px">⏰</div><div style="font-size:28px;font-weight:700;margin-bottom:10px">链接已过期</div><div style="font-size:14px;color:var(--muted)">此链接的有效期已结束</div></div>';
    return;
  }

  var remainTxt = '永久有效';
  if(payload.e){
    var s = Math.floor((payload.e - Date.now()) / 1000);
    if(s < 60) remainTxt = s + ' 秒后过期';
    else if(s < 3600) remainTxt = Math.floor(s / 60) + ' 分钟后过期';
    else if(s < 86400) remainTxt = Math.floor(s / 3600) + ' 小时后过期';
    else remainTxt = Math.floor(s / 86400) + ' 天后过期';
  }

  var h = '';
  h += '<div style="max-width:600px;margin:40px auto;text-align:center">';
  h += '<div style="width:100px;height:100px;border-radius:26px;background:linear-gradient(135deg,#5ac8fa,#bf5af2 50%,#ff375f);display:grid;place-items:center;font-size:52px;margin:0 auto 22px;box-shadow:0 20px 60px rgba(168,85,247,.5)">🐮</div>';
  h += '<div style="font-size:32px;font-weight:700;margin-bottom:10px">一头牛东西托管</div>';
  h += '<div style="font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.7">有人给你分享了一个文件</div>';
  h += '<div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#7ee2a8;font-size:11.5px;font-weight:600;margin-bottom:20px"><span style="width:6px;height:6px;border-radius:50%;background:#22c55e"></span>端到端加密 · 服务器无法查看</div>';
  h += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px;text-align:left">';
  h += '<div style="font-size:15px;font-weight:600;margin-bottom:6px;word-break:break-all">📎 ' + escapeHtml(payload.n) + '</div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">原始大小：' + formatSize(payload.s) + '　·　' + remainTxt + '</div>';
  h += '<button class="btn btn-primary" id="hostDownload" style="padding:14px 32px;font-size:15px;width:100%">⬇️ 下载文件</button>';
  h += '<div id="hostDlStatus" style="margin-top:12px;font-size:12px;color:var(--muted);text-align:center"></div>';
  h += '</div>';
  h += '<div style="font-size:11.5px;color:var(--muted);line-height:1.7">🔒 文件在本地加密后才上传<br>密钥在 URL 片段中，浏览器不会发送给服务器<br>🐮 一头牛东西托管</div>';
  h += '</div>';

  root.innerHTML = h;

  var btn = root.querySelector('#hostDownload');
  var status = root.querySelector('#hostDlStatus');

  btn.onclick = function(){
    btn.disabled = true;
    btn.textContent = '⏳ 下载中…';
    status.textContent = '正在下载密文…';

    fetchTimeout(payload.u, {}, 60000).then(function(r){
      if(!r.ok) throw new Error('下载失败 HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function(ab){
      status.textContent = '正在本地解密…';
      var encBytes = new Uint8Array(ab);
      var keyRaw = base64ToBytes(payload.k);
      return crypto.subtle.importKey('raw', keyRaw, { name: 'AES-GCM' }, false, ['decrypt'])
        .then(function(key){
          var iv = encBytes.slice(0, 12);
          var ct = encBytes.slice(12);
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
        });
    }).then(function(pt){
      var blob = new Blob([pt]);
      downloadBlob(blob, payload.n);
      status.textContent = '✅ 解密完成，已开始下载';
      showToast('下载成功', 'ok');
    }).catch(function(e){
      console.error(e);
      status.innerHTML = '<span style="color:#ff8080">❌ ' + escapeHtml(e.message) + '</span>';
      showToast('失败', 'err');
    }).then(function(){
      btn.disabled = false;
      btn.textContent = '⬇️ 下载文件';
    });
  };
}

      var xs = fileList.querySelectorAll('.fx');
      for(var i = 0; i < xs.length; i++){
        (function(idx){
          xs[i].onclick = function(){
            files.splice(idx, 1);
            refresh();
          };
        })(i);
      }
    }

    setupDrop(drop, fileInput, function(newFiles){
      files = files.concat(newFiles);
      refresh();
    });

    qInput.oninput = function(){ qVal.textContent = qInput.value + '%'; };
    clearBtn.onclick = function(){
      files = [];
      resultArea.innerHTML = '';
      refresh();

      if(files.length === 0) return;
      runBtn.disabled = true;
      clearBtn.disabled = true;
      resultArea.innerHTML = '';
      bar.classList.add('on');

      var mime = fmtInput.value;
      var quality = parseInt(qInput.value, 10) / 100;
      var maxSide = parseInt(maxInput.value, 10) || 0;
      var extMap = { 'image/jpeg': 'jpg', 'image/webp': 'webp' };
      var totalBefore = 0;
      var totalAfter = 0;
      var idx = 0;

      function processNext(){
        if(idx >= files.length){
          barFill.style.width = '100%';
          var saved = totalBefore > 0 ? ((1 - totalAfter / totalBefore) * 100).toFixed(1) : 0;
          resultArea.insertAdjacentHTML('afterbegin',
            '<div class="result ok">✅ 完成！共 ' + files.length + ' 张，' + formatSize(totalBefore) + ' → ' + formatSize(totalAfter) + '（节省 ' + saved + '%）</div>'

          runBtn.disabled = false;
          clearBtn.disabled = false;
          showToast('压缩完成', 'ok');
          return;

        var f = files[idx];

        createImageBitmap(f).then(function(bmp){
          var w = bmp.width, h = bmp.height;
          if(maxSide && Math.max(w, h) > maxSide){
            var s = maxSide / Math.max(w, h);
            w = Math.round(w * s);
            h = Math.round(h * s);
          }
          var cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(bmp, 0, 0, w, h);
          bmp.close();

          cv.toBlob(function(blob){
            if(!blob){
              resultArea.insertAdjacentHTML('beforeend', '<div class="result err">❌ ' + escapeHtml(f.name) + '：处理失败</div>');
              idx++;
              processNext();
              return;
            }
            totalBefore += f.size;
            totalAfter += blob.size;
            downloadBlob(blob, f.name.replace(/\.[^.]+$/, '') + '_min.' + extMap[mime]);
            resultArea.insertAdjacentHTML('beforeend', '<div class="result ok">✅ ' + escapeHtml(f.name) + '　' + formatSize(f.size) + ' → ' + formatSize(blob.size) + '</div>');
            idx++;
            processNext();
          }, mime, quality);
        }).catch(function(err){
          resultArea.insertAdjacentHTML('beforeend', '<div class="result err">❌ ' + escapeHtml(f.name) + '：' + escapeHtml(err.message) + '</div>');
          idx++;
          processNext();
        });
      }
      processNext();
    };
  }
});

TOOLS.push({
  id: 'text-crypto',
  name: '文本加密解密',
  icon: '✉️',
  category: 'crypto',
  desc: 'AES-256-GCM 加解密',
  render: function(root){
    if(!window.crypto || !window.crypto.subtle){
      root.innerHTML = '<div class="box"><div class="result err">❌ 当前环境不支持 Web Crypto（需要 HTTPS 或 localhost）</div></div>';
      return;
    }
    var h = '';
    h += '<div class="box">';
    h += '<div class="row" style="margin-bottom:14px">';
    h += '<button class="btn btn-primary" id="tcTabEnc">加密</button>';
    h += '<button class="btn" id="tcTabDec">解密</button>';
    h += '</div>';
    h += '<div class="field"><label class="label">文本内容</label><textarea class="textarea" id="tcText" rows="5" placeholder="输入要加密的文本…"></textarea></div>';
    h += '<div class="field"><label class="label">密码</label><input type="password" class="input" id="tcPw" placeholder="请输入密码"></div>';
    h += '<div class="row"><button class="btn btn-primary" id="tcRun">加密</button><button class="btn" id="tcCopy">复制结果</button></div>';
    h += '<div class="field" style="margin-top:14px"><label class="label">结果</label><textarea class="textarea" id="tcOut" rows="5" readonly></textarea></div>';
    h += '<div id="tcMsg"></div>';
    h += '</div>';
    root.innerHTML = h;

    var mode = 'enc';
    var tabEnc = root.querySelector('#tcTabEnc');
    var tabDec = root.querySelector('#tcTabDec');
    var textInput = root.querySelector('#tcText');
    var pwInput = root.querySelector('#tcPw');
    var runBtn = root.querySelector('#tcRun');
    var copyBtn = root.querySelector('#tcCopy');
    var outArea = root.querySelector('#tcOut');
    var msgArea = root.querySelector('#tcMsg');

    function setMode(m){
      mode = m;
      if(m === 'enc'){
        tabEnc.className = 'btn btn-primary';
        tabDec.className = 'btn';
        runBtn.textContent = '加密';
        textInput.placeholder = '输入要加密的文本…';
      } else {
        tabEnc.className = 'btn';
        tabDec.className = 'btn btn-primary';
        runBtn.textContent = '解密';
        textInput.placeholder = '粘贴要解密的密文…';
      }
      outArea.value = '';
      msgArea.innerHTML = '';
    }
    tabEnc.onclick = function(){ setMode('enc'); };
    tabDec.onclick = function(){ setMode('dec'); };

    function deriveKey(password, salt){
      return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
        .then(function(km){
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' },
            km,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
          );
        });
    }

    runBtn.onclick = function(){
      var text = textInput.value;
      var pw = pwInput.value;
      msgArea.innerHTML = '';
      if(!text){ showToast('请输入内容', 'err'); return; }
      if(!pw){ showToast('请输入密码', 'err'); return; }
      runBtn.disabled = true;

      if(mode === 'enc'){
        var salt = crypto.getRandomValues(new Uint8Array(16));
        var iv = crypto.getRandomValues(new Uint8Array(12));
        deriveKey(pw, salt).then(function(key){
          return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text));
        }).then(function(ct){
          var ctArr = new Uint8Array(ct);
          var out = new Uint8Array(28 + ctArr.length);
          out.set(salt, 0);
          out.set(iv, 16);
          out.set(ctArr, 28);
          outArea.value = bytesToBase64(out);
          msgArea.innerHTML = '<div class="result ok">✅ 加密完成</div>';
          showToast('加密完成', 'ok');
        }).catch(function(e){
          msgArea.innerHTML = '<div class="result err">❌ ' + escapeHtml(e.message) + '</div>';
        }).then(function(){
          runBtn.disabled = false;
        });
      } else {
        var raw;
        try { raw = base64ToBytes(text.trim()); }
        catch(e){
          msgArea.innerHTML = '<div class="result err">❌ 密文格式不正确</div>';
          runBtn.disabled = false;
          return;
        }
        if(raw.length < 28){
          msgArea.innerHTML = '<div class="result err">❌ 密文太短</div>';
          runBtn.disabled = false;
          return;
        }
        var salt2 = raw.slice(0, 16);
        var iv2 = raw.slice(16, 28);
        var ct2 = raw.slice(28);
        deriveKey(pw, salt2).then(function(key){
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv2 }, key, ct2);
        }).then(function(pt){
          outArea.value = new TextDecoder().decode(pt);
          msgArea.innerHTML = '<div class="result ok">✅ 解密完成</div>';
          showToast('解密完成', 'ok');
        }).catch(function(e){
          msgArea.innerHTML = '<div class="result err">❌ 密码错误或密文已损坏</div>';
        }).then(function(){
          runBtn.disabled = false;
        });
      }
    };

    copyBtn.onclick = function(){
      if(!outArea.value){ showToast('结果为空', 'err'); return; }
      copyToClipboard(outArea.value);
    };
  }
});

    function generate(){
      var pool = '';
      if(cLower.checked) pool += 'abcdefghijkmnpqrstuvwxyz';
      if(cUpper.checked) pool += 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      if(cDigit.checked) pool += '23456789';
      if(cSymbol.checked) pool += '!@#$%^&*()-_=+';
      if(!pool){ pwdOut.textContent = '请至少选择一种字符类型'; return; }
      var len = parseInt(lenInput.value, 10);
      var result = '';
      var buf = new Uint8Array(len);
      crypto.getRandomValues(buf);
      for(var i = 0; i < len; i++){
        result += pool[buf[i] % pool.length];
      }
      pwdOut.textContent = result;
    }

    lenInput.oninput = function(){ lenVal.textContent = lenInput.value; generate(); };
    cLower.onchange = generate;
    cUpper.onchange = generate;
    cDigit.onchange = generate;
    cSymbol.onchange = generate;
    root.querySelector('#pwdGen').onclick = generate;
    root.querySelector('#pwdCopy').onclick = function(){
      var t = pwdOut.textContent;
      if(!t || t.indexOf('请至少') === 0 || t.indexOf('点击') === 0) return;
      copyToClipboard(t);
    };
    generate();
  }
});

TOOLS.push({
  id: 'todo',
  name: '待办清单',
  icon: '✅',
  category: 'life',
  desc: '本地保存待办事项',
  render: function(root){
    var h = '';
    h += '<div class="box">';
    h += '<div class="row" style="margin-bottom:14px"><input type="text" class="input" id="todoInput" placeholder="输入待办事项，回车添加…" style="flex:1"><button class="btn btn-primary" id="todoAdd">添加</button></div>';
    h += '<div id="todoList"></div>';
    h += '</div>';
    root.innerHTML = h;

    var KEY = 'toolbox_todos';
    var todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ todos = []; }

    var todoInput = root.querySelector('#todoInput');
    var addBtn = root.querySelector('#todoAdd');
    var todoList = root.querySelector('#todoList');

    function save(){
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch(e){}
    }
    function render(){
      if(todos.length === 0){
        todoList.innerHTML = '<div class="hint" style="text-align:center;padding:20px">还没有待办</div>';
        return;
      }
      var h2 = '';
      for(var i = 0; i < todos.length; i++){
        var t = todos[i];
        h2 += '<div class="file-item" style="padding:12px 14px">';
        h2 += '<input type="checkbox" data-idx="' + i + '" data-act="toggle" ' + (t.done ? 'checked' : '') + ' style="cursor:pointer">';
        h2 += '<span class="fn" style="' + (t.done ? 'text-decoration:line-through;color:var(--muted)' : '') + '">' + escapeHtml(t.text) + '</span>';
        h2 += '<button class="fx" data-idx="' + i + '" data-act="del">✕</button>';
        h2 += '</div>';
      }
      todoList.innerHTML = h2;
      var btns = todoList.querySelectorAll('[data-act]');
      for(var j = 0; j < btns.length; j++){
        btns[j].onclick = function(e){
          var idx = parseInt(e.target.getAttribute('data-idx'), 10);
          var act = e.target.getAttribute('data-act');
          if(act === 'del'){
            todos.splice(idx, 1);
          } else if(act === 'toggle'){
            todos[idx].done = e.target.checked;
          }
          save();
          render();
        };
      }
    }
    function add(){
      var v = todoInput.value.trim();
      if(!v) return;
      todos.unshift({ text: v, done: false });
      todoInput.value = '';
      save();
      render();
    }
    addBtn.onclick = add;
    todoInput.onkeydown = function(e){ if(e.key === 'Enter') add(); };
    render();
  }
});

TOOLS.push({
  id: 'calc',
  name: '计算器',
  icon: '🧮',
  category: 'life',
  desc: '简单计算器',
  render: function(root){
    var h = '';
    h += '<div class="box">';
    h += '<input type="text" class="input" id="calcDisplay" readonly value="0" style="font-size:24px;text-align:right;padding:16px;font-family:ui-monospace,monospace">';
    h += '<div id="calcPad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px"></div>';
    h += '</div>';
    root.innerHTML = h;

    var display = root.querySelector('#calcDisplay');
    var pad = root.querySelector('#calcPad');
    var keys = ['C','(',')','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','⌫','='];
    var expr = '';

    var h2 = '';
    for(var i = 0; i < keys.length; i++){
      h2 += '<button class="btn" data-k="' + keys[i] + '" style="padding:14px;font-size:16px">' + keys[i] + '</button>';
    }
    pad.innerHTML = h2;

    var btns = pad.querySelectorAll('button');
    for(var j = 0; j < btns.length; j++){
      btns[j].onclick = function(e){
        var k = e.target.getAttribute('data-k');
        if(k === 'C'){ expr = ''; display.value = '0'; return; }
        if(k === '⌫'){ expr = expr.slice(0, -1); display.value = expr || '0'; return; }
        if(k === '='){
          try {
            var e2 = expr.replace(/×/g, '*').replace(/÷/g, '/');
            var r = Function('"use strict";return (' + e2 + ')')();
            display.value = r;
            expr = String(r);
          } catch(err){
            display.value = '错误';
            expr = '';
          }
          return;
        }
        expr += k;
        display.value = expr;
      };
    }
  }
});

function renderNav(){
  var nav = document.getElementById('nav');
  if(!nav) return;
  var h = '';
  var cats = Object.keys(CATEGORIES);
  for(var i = 0; i < cats.length; i++){
    var c = cats[i];
    var cat = CATEGORIES[c];
    var tools = TOOLS.filter(function(t){ return t.category === c; });
    if(tools.length === 0) continue;
    h += '<div class="nav-group">';
    h += '<div class="nav-title">' + cat.icon + ' ' + cat.name + '</div>';
    for(var j = 0; j < tools.length; j++){
      var t = tools[j];
      h += '<div class="nav-item" data-id="' + t.id + '"><span class="ic">' + t.icon + '</span>' + escapeHtml(t.name) + '</div>';
    }
    h += '</div>';
  }
  nav.innerHTML = h;

  var items = nav.querySelectorAll('.nav-item');
  for(var k = 0; k < items.length; k++){
    items[k].onclick = function(e){
      var id = e.currentTarget.getAttribute('data-id');
      openTool(id);
      document.getElementById('sidebar').classList.remove('on');
      document.getElementById('mask').classList.remove('on');
    };
  }
}

  var h = '';
  h += '<div class="hero">';
  h += '<h2>万能小工具箱 <span>Pro</span></h2>';
  h += '<p>全部功能本地运行，数据不上传。共 ' + TOOLS.length + ' 个精选工具，持续可用。</p>';

  h += '<div class="stat"><b>0</b><span>数据上传</span></div>';
  h += '</div>';
  h += '</div>';

  var cats = Object.keys(CATEGORIES);
  for(var i = 0; i < cats.length; i++){
    var c = cats[i];
    var cat = CATEGORIES[c];
    var tools = TOOLS.filter(function(t){ return t.category === c; });
    if(tools.length === 0) continue;
    h += '<div class="section-title">' + cat.icon + ' ' + cat.name + '</div>';
    h += '<div class="grid">';
    for(var j = 0; j < tools.length; j++){
      var t = tools[j];
      h += '<div class="card" data-id="' + t.id + '" style="position:relative">';
      h += '<div class="icon">' + t.icon + '</div>';
      h += '<div class="name">' + escapeHtml(t.name) + (t.isNew ? '<span class="new-badge">NEW</span>' : '') + '</div>';
      h += '<div class="desc">' + escapeHtml(t.desc || '') + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }
  content.innerHTML = h;

  var cards = content.querySelectorAll('.card');
  for(var k = 0; k < cards.length; k++){
    cards[k].onclick = function(e){
      var id = e.currentTarget.getAttribute('data-id');
      openTool(id);
    };
  }
}

var currentToolId = null;

function openTool(id){
  var tool = null;
  for(var i = 0; i < TOOLS.length; i++){
    if(TOOLS[i].id === id){ tool = TOOLS[i]; break; }
  }
  if(!tool) return;

  currentToolId = id;
  var panel = document.getElementById('panel');
  var panelBody = document.getElementById('panelBody');
  var panelTitle = document.getElementById('panelTitle');
  var panelIcon = document.getElementById('panelIcon');
  var crumb = document.getElementById('crumb');

  panelTitle.textContent = tool.name;
  panelIcon.textContent = tool.icon;
  crumb.textContent = tool.name;
  panelBody.innerHTML = '';

  panel.classList.add('on');
  document.body.style.overflow = 'hidden';

  try {
    tool.render(panelBody);
  } catch(err){
    console.error('工具渲染出错:', err);
    panelBody.innerHTML = '<div class="box"><div class="result err">❌ 工具加载失败：' + escapeHtml(err.message) + '</div></div>';
  }

  panel.scrollTop = 0;
}

function closeTool(){
  currentToolId = null;
  document.getElementById('panel').classList.remove('on');
  document.body.style.overflow = '';
  document.getElementById('crumb').textContent = '首页';
  if(location.hash.indexOf('#podcast') === 0 || location.hash.indexOf('#host') === 0){
    try { history.replaceState(null, '', location.pathname); } catch(e){}
  }
}

function bindEvents(){
  var back = document.getElementById('panelBack');
  if(back) back.onclick = closeTool;

  var menu = document.getElementById('menuBtn');
  if(menu){
    menu.onclick = function(){
      document.getElementById('sidebar').classList.add('on');
      document.getElementById('mask').classList.add('on');
    };
  }
  var mask = document.getElementById('mask');
  if(mask){
    mask.onclick = function(){
      document.getElementById('sidebar').classList.remove('on');
      document.getElementById('mask').classList.remove('on');
    };
  }
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeTool();
  });
}

function start(){
  try {
    renderNav();
    renderHome();
    bindEvents();

    // 检测 hash 路由
    var hash = location.hash;
    if(hash.indexOf('#podcast=') === 0 || hash.indexOf('#podcast-edit=') === 0){
      openTool('podcast');
    } else if(hash.indexOf('#host=') === 0){
      openTool('hosting');
    }

    console.log('✅ 万能小工具箱已就绪 · 共 ' + TOOLS.length + ' 个工具');
  } catch(err){
    console.error('启动失败:', err);
    document.getElementById('content').innerHTML = '<div class="box"><div class="result err">❌ 启动失败：' + escapeHtml(err.message) + '</div></div>';
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}
</script>
