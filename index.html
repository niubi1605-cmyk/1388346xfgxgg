<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>剧集播放器</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:sans-serif;overflow:hidden}
.player{position:relative;width:100%;max-width:900px;margin:0 auto;background:#000;aspect-ratio:16/9;overflow:hidden}
.player.fullscreen{position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:9999;max-width:none;aspect-ratio:auto}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}

.overlay{position:absolute;inset:0;z-index:10}

.controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:12px 16px;display:flex;align-items:center;gap:12px;color:#fff;z-index:20}
.ctrl-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:6px 10px;border-radius:4px;touch-action:manipulation}
.ctrl-btn:hover{background:rgba(255,255,255,.2)}

/* 修复②：进度条加大可点击/可拖动热区（原来只有 4px 高，很难点中） */
.progress{flex:1;height:22px;position:relative;cursor:pointer;touch-action:none}
.progress::before{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:rgba(255,255,255,.3);border-radius:2px}
.progress-fill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;background:#ff6b00;border-radius:2px;width:0%;pointer-events:none}
.progress-fill::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#ff6b00;opacity:0;transition:opacity .15s}
.progress:hover .progress-fill::after,.progress:active .progress-fill::after{opacity:1}

.time{font-size:12px;white-space:nowrap}

/* 修复①：菜单按钮层级提到剧集面板之上，面板打开时依然可点 */
.menu-dots{position:absolute;top:12px;right:12px;z-index:36}
.menu-pop{position:absolute;top:40px;right:12px;background:rgba(0,0,0,.95);border-radius:8px;padding:8px 0;min-width:140px;z-index:40;display:none;flex-direction:column}
.menu-pop.show{display:flex}
.menu-item{background:none;border:none;color:#fff;text-align:left;padding:10px 16px;cursor:pointer;font-size:14px;white-space:nowrap}
.menu-item:hover{background:rgba(255,255,255,.15)}

.episode-panel{position:absolute;top:0;left:0;right:0;bottom:60px;background:rgba(0,0,0,.96);z-index:35;display:none;flex-direction:column;padding:20px}
.episode-panel.show{display:flex}
.ep-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ep-head h3{color:#fff;font-size:16px}
.ep-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 10px;border-radius:4px;line-height:1.4}
.ep-close:hover{background:rgba(255,255,255,.2)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;overflow-y:auto;margin-top:10px;padding-right:4px}

.ep-btn{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:12px 0;cursor:pointer;font-size:14px;position:relative}
.ep-btn.vip{border-color:#ff6b00;color:#ff6b00}
.ep-btn.vip::after{content:"🔒";position:absolute;top:2px;right:4px;font-size:10px}
.ep-btn.unlocked{background:#1a5d1a;color:#fff;border-color:#2d8a2d}
/* 修复③：active 放在最后，避免被 vip/unlocked 覆盖 */
.ep-btn.active{background:#ff6b00;color:#fff;border-color:#ff6b00}

.ep-tag{position:absolute;top:8px;left:12px;background:#ff6b00;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;z-index:20}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#222;padding:24px;border-radius:12px;text-align:center;min-width:280px}
.modal-box h3{color:#fff;margin-bottom:12px}
.modal-box input{width:100%;padding:10px;border-radius:6px;border:none;font-size:16px;margin-bottom:12px;outline:none}
.modal-box button{background:#ff6b00;color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px;margin:4px}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline preload="metadata"></video>
  <div class="overlay" id="overlay"></div>
  <div class="ep-tag" id="epTag">第 1 集</div>

  <div class="menu-dots">
    <button class="ctrl-btn" id="menuBtn" style="font-size:20px">⋮</button>
    <div class="menu-pop" id="menuPop">
      <button class="menu-item" id="miEp">更多内容（剧集）</button>
      <button class="menu-item" id="miUnlock">解锁 VIP 剧集</button>
      <button class="menu-item" id="miPrev">上一集 (P)</button>
      <button class="menu-item" id="miNext">下一集 (N)</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnPlay">▶</button>
    <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
    <span class="time" id="time">00:00 / 00:00</span>
    <button class="ctrl-btn" id="btnFs">⛶</button>
  </div>

  <div class="episode-panel" id="epPanel">
    <div class="ep-head">
      <h3>剧集列表</h3>
      <button class="ep-close" id="epClose" aria-label="关闭">✕</button>
    </div>
    <div class="ep-grid" id="epGrid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3>解锁 VIP 剧集</h3>
      <input type="password" id="codeInput" placeholder="请输入解锁码">
      <div><button id="codeOk">确认</button><button id="codeCancel">取消</button></div>
      <div id="codeMsg" style="color:#ff4444;margin-top:8px;font-size:12px"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

const video = $('video');
const player = $('player');
const progressEl = $('progress');

/* ---------- VIP 状态 ---------- */
try { vip = localStorage.getItem('vp_vip') === '1'; } catch (e) {}

/* ---------- 渲染剧集网格 ---------- */
(function buildGrid() {
  const grid = $('epGrid');
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= TOTAL_EP; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn';
    b.dataset.ep = String(i);
    b.textContent = i;
    b.addEventListener('click', () => switchEp(i));
    frag.appendChild(b);
  }
  grid.appendChild(frag);
})();

/* ---------- UI 刷新（修复③：不再用 className 覆盖 active） ---------- */
function updateUI() {
  $('epTag').textContent = `第 ${cur} 集`;
  document.querySelectorAll('.ep-btn').forEach(b => {
    const n = Number(b.dataset.ep);
    b.classList.toggle('active', n === cur);
    b.classList.toggle('vip', n > FREE_EP && !vip);
    b.classList.toggle('unlocked', n > FREE_EP && vip);
  });
}

function isVipEp(n) { return n > FREE_EP; }

/* ---------- 切换剧集 ---------- */
function switchEp(n) {
  if (n < 1 || n > TOTAL_EP) return;
  if (isVipEp(n) && !vip) { closeMenu(); showModal(); return; }

  cur = n;
  updateUI();
  closeMenu();
  $('epPanel').classList.remove('show');
  loadSource(EPISODE_URLS[n - 1]);
}

/* ---------- 加载片源（含 Hls 兜底与静默 play） ---------- */
function loadSource(url) {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }

  video.pause();
  video.removeAttribute('src');
  try { video.load(); } catch (e) {}

  $('progressFill').style.width = '0%';
  $('time').textContent = '00:00 / 00:00';

  if (/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        try { hls.destroy(); } catch (e) {}
        hls = null;
        showToast('播放失败，请检查视频地址或网络');
      }
    });
  } else {
    video.src = url;
  }

  // 静默处理自动播放被拦截
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
}

/* ---------- 播放 / 暂停 ---------- */
function togglePlay() {
  if (video.paused) {
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  } else {
    video.pause();
  }
}
$('btnPlay').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('overlay').addEventListener('click', () => { closeMenu(); togglePlay(); });
video.addEventListener('play',  () => $('btnPlay').textContent = '⏸');
video.addEventListener('pause', () => $('btnPlay').textContent = '▶');

/* ---------- 时间格式化 ---------- */
function fmt(t) {
  if (!isFinite(t) || t < 0) return '00:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
}

video.addEventListener('timeupdate', () => {
  if (seeking) return;
  const dur = video.duration;
  if (isFinite(dur) && dur > 0) {
    $('progressFill').style.width = (video.currentTime / dur * 100) + '%';
    $('time').textContent = `${fmt(video.currentTime)} / ${fmt(dur)}`;
  }
});
video.addEventListener('loadedmetadata', () => {
  $('time').textContent = `00:00 / ${fmt(video.duration)}`;
});

/* ---------- 进度条：点击 + 拖拽（修复②） ---------- */
function seekTo(clientX) {
  const dur = video.duration;
  if (!isFinite(dur) || dur <= 0) return;
  const r = progressEl.getBoundingClientRect();
  if (!r.width) return;
  const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  video.currentTime = ratio * dur;
  $('progressFill').style.width = (ratio * 100) + '%';
  $('time').textContent = `${fmt(ratio * dur)} / ${fmt(dur)}`;
}

progressEl.addEventListener('pointerdown', e => {
  if (!isFinite(video.duration) || video.duration <= 0) return;
  seeking = true;
  try { progressEl.setPointerCapture(e.pointerId); } catch (_) {}
  seekTo(e.clientX);
  e.preventDefault();
});
progressEl.addEventListener('pointermove', e => {
  if (seeking) seekTo(e.clientX);
});
function endSeek(e) {
  if (!seeking) return;
  seeking = false;
  try { progressEl.releasePointerCapture(e.pointerId); } catch (_) {}
}
progressEl.addEventListener('pointerup', endSeek);
progressEl.addEventListener('pointercancel', endSeek);

$('miNext').addEventListener('click', () => { closeMenu(); switchEp(cur + 1); });

$('epClose').addEventListener('click', () => $('epPanel').classList.remove('show'));

document.addEventListener('click', closeMenu);

/* ---------- 全屏（含 iOS 兜底） ---------- */
function toggleFs() {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFs) {
    const req = player.requestFullscreen || player.webkitRequestFullscreen ||
                player.mozRequestFullScreen || player.msRequestFullscreen;
    if (req) {
      try {
        const p = req.call(player);
        if (p && p.catch) p.catch(() => {});
      } catch (_) {}
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) { try { exit.call(document); } catch (_) {} }
  }
}
$('btnFs').addEventListener('click', e => { e.stopPropagation(); toggleFs(); });

['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    player.classList.toggle('fullscreen', on);
  })
);

/* ---------- 快捷键（输入框内不再误触） ---------- */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

  switch (e.key) {
    case 'n': case 'N': switchEp(cur + 1); break;
    case 'p': case 'P': switchEp(cur - 1); break;
    case ' ': case 'k': case 'K': e.preventDefault(); togglePlay(); break;
    case 'f': case 'F': toggleFs(); break;
    case 'Escape':
      $('epPanel').classList.remove('show');
      $('modal').classList.remove('show');
      closeMenu();
      break;
  }
});

/* ---------- 解锁弹窗 ---------- */
function showModal() {
  closeMenu();
  $('codeInput').value = '';
  $('codeMsg').textContent = '';
  $('modal').classList.add('show');
  setTimeout(() => { try { $('codeInput').focus(); } catch (_) {} }, 60);
}

function tryUnlock() {
  const val = $('codeInput').value.trim();
  if (val === VIP_CODE) {
    vip = true;
    try { localStorage.setItem('vp_vip', '1'); } catch (e) {}
    $('modal').classList.remove('show');
    updateUI();
    showToast('🎉 解锁成功！');
  } else {
    $('codeMsg').textContent = '解锁码错误';
  }
}

$('codeOk').addEventListener('click', tryUnlock);
$('codeCancel').addEventListener('click', () => $('modal').classList.remove('show'));
$('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); tryUnlock(); }
});
$('modal').addEventListener('click', e => {
  if (e.target === $('modal')) $('modal').classList.remove('show');
});

/* ---------- 轻提示 ---------- */
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- 播放结束自动下一集 ---------- */
video.addEventListener('ended', () => {
  if (cur < TOTAL_EP) switchEp(cur + 1);
});

/* ---------- 初始化 ---------- */
updateUI();
switchEp(1);
</script>
</body>
